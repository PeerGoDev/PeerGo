openapi: 3.0.3
info:
  title: PeerGo Core API
  version: 0.1.0
  description: PeerGo 的同源 JSON API。该契约是 Go transport 与第一方 Web client 的唯一 HTTP 类型来源；生成文件不得手工修改。
servers:
  - url: /
paths:
  /api/v1/registrations:
    post:
      operationId: createRegistration
      summary: 按当前站点准入策略创建普通账户，并保留开放注册中的可选邀请关系
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.register.anonymous
      x-credential-audience: anonymous
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 浏览器为一次注册尝试生成并在安全重试时复用的 UUID。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '201':
          description: 账户与凭据已完成跨存储激活。邮箱仍待验证，首版应先使用用户名登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: 为当前账户请求邮箱验证邮件
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.email.verify.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailVerificationRequest'
      responses:
        '202':
          description: 请求已按枚举安全语义处理；响应不说明重新输入的地址是否匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationDispatch'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: 使用一次性 bearer token 确认邮箱所有权
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.email.confirm.anonymous
      x-credential-audience: anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailVerificationRequest'
      responses:
        '200':
          description: Vault identifier 与 Core 用户投影均已完成验证。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/password-recovery-requests:
    post:
      operationId: requestPasswordRecovery
      summary: 使用注册邮箱请求一次性密码恢复链接
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.password.recovery.request.anonymous
      x-credential-audience: anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordRecoveryRequest'
      responses:
        '202':
          description: 请求已按枚举安全语义处理；响应不说明邮箱是否命中已验证账户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryDispatch'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/password-recoveries/confirm:
    post:
      operationId: confirmPasswordRecovery
      summary: 使用一次性密码恢复凭证设置新密码
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.password.recovery.confirm.anonymous
      x-credential-audience: anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordRecoveryRequest'
      responses:
        '200':
          description: Vault 密码已替换，Core 已撤销该账户的全部 Web 与 staff 会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/session:
    get:
      operationId: getWebSession
      summary: 获取当前 Web 会话
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: session.read.self
      x-credential-audience: web-session
      responses:
        '200':
          description: 当前有效 Web 会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSession'
        '204':
          description: 当前没有有效会话。
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      operationId: createWebSession
      summary: 使用站内凭据创建 Web 会话
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: session.create.self
      x-credential-audience: anonymous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: 登录成功；原始会话 token 只通过 HttpOnly cookie 返回。
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite 会话 cookie。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSession'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '428':
          description: 密码已验证，但该账户需要继续提交 TOTP 或一次性恢复码；此响应不会创建会话。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      operationId: deleteWebSession
      summary: 撤销当前 Web 会话
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: session.revoke.self
      x-credential-audience: web-session
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          description: 与当前会话绑定的 CSRF token。
          schema:
            type: string
            minLength: 43
            maxLength: 43
      responses:
        '204':
          description: 会话已撤销或已经不存在。
          headers:
            Set-Cookie:
              description: 立即过期的会话 cookie。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/profile:
    patch:
      operationId: updateMyProfile
      summary: 修改当前账户的公开资料
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.profile.update.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: 已更新的当前会话用户投影。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/invitations:
    get:
      operationId: getMyInvitations
      summary: 查看自己的邀请资格、名额与邀请记录
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: invitation.read.self
      x-credential-audience: web-session
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 99999
            default: 0
      responses:
        '200':
          description: 邀请资格与不含任何邀请码明文的历史记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOverview'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      operationId: issueMyInvitation
      summary: 签发一个自己的单次注册邀请码
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: invitation.issue.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
      responses:
        '201':
          description: 邀请码已签发；明文 token 仅在本响应返回一次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssueResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/invitations/{invitation_id}/revocation:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeMyInvitation
      summary: 撤销一个自己尚未被领取的邀请码
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: invitation.revoke.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
      responses:
        '200':
          description: 邀请码已撤销并立即释放名额。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/avatar:
    put:
      operationId: updateMyAvatar
      summary: 上传并替换当前账户的公开头像
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.profile.update.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              minLength: 1
              maxLength: 1048576
      responses:
        '200':
          description: 已完成完整回读校验并设为当前头像。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarRevision'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        description: 成员用户名；大小写不敏感，响应始终返回规范大小写。
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      operationId: getPublicUserProfile
      summary: 获取站内成员的公开资料
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: user.profile.read.member
      x-credential-audience: web-session
      responses:
        '200':
          description: 不包含邮箱、IP、限制状态或私密流量的成员公开资料。
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/users/{username}/avatar:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      operationId: getPublicUserAvatar
      summary: 获取站内成员当前公开头像
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: user.profile.read.member
      x-credential-audience: web-session
      responses:
        '200':
          description: 已完成完整 SHA-256 与长度校验的公开头像。
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
            ETag:
              required: true
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/security:
    get:
      operationId: getAccountSecurity
      summary: 获取当前账户的 Core 安全概览
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: session.read.self
      x-credential-audience: web-session
      responses:
        '200':
          description: 只包含 Core 所有的脱敏安全状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSecurityOverview'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/download-restriction:
    get:
      operationId: getMyDownloadRestriction
      summary: 查看当前用户的下载限制来源与人工限制申诉状态
      description: 只读取聚合限制来源；旧站或人工来源可在本页面申诉，长期分享率和 H&R 必须进入各自页面处理。响应不包含 Tracker、政策或操作员证据。
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: user.downloadrestriction.read.self
      x-credential-audience: web-session
      responses:
        '200':
          description: 当前用户的下载限制来源分解和旧站或人工限制申诉状态。
          headers:
            Cache-Control:
              description: 本人限制与申诉内容不得进入浏览器或代理缓存。
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadRestrictionStatus'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/download-restriction/appeals:
    post:
      operationId: submitMyDownloadRestrictionAppeal
      summary: 为当前用户的旧站或人工下载限制提交一次申诉
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: user.downloadrestriction.appeal.create.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDownloadRestrictionAppealRequest'
      responses:
        '201':
          description: 申诉已绑定当前旧站或人工下载限制版本。
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAccessAppeal'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/totp:
    delete:
      operationId: disableMyTOTP
      summary: 关闭当前账户的 TOTP
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.totp.manage.self
      x-credential-audience: web-session
      parameters:
        - $ref: '#/components/parameters/WebCSRFHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorReauthenticationRequest'
      responses:
        '200':
          description: TOTP 与所有剩余恢复码已失效，当前会话保留。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDisableResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/totp/enrollments:
    post:
      operationId: startMyTOTPEnrollment
      summary: 开始当前账户的 TOTP 登记
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.totp.manage.self
      x-credential-audience: web-session
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTOTPEnrollmentRequest'
      responses:
        '200':
          description: 一次性登记秘钥与标准 otpauth URI；确认前不会启用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPEnrollmentStart'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/me/totp/enrollments/{enrollment_id}/confirm:
    parameters:
      - name: enrollment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmMyTOTPEnrollment
      summary: 验证代码并启用当前账户的 TOTP
      tags:
        - identity
      x-audience:
        - web
      x-owner: core-identity
      x-permission: account.totp.manage.self
      x-credential-audience: web-session
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTOTPEnrollmentRequest'
      responses:
        '200':
          description: TOTP 已启用；恢复码只在短暂可重试窗口内返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPEnrollmentResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
