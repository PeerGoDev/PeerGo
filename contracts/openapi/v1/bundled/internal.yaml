  /api/v1/me/hit-and-runs:
    get:
      operationId: listMyHitAndRuns
      summary: 获取当前用户的 H&R 义务与达标进度
      tags:
        - traffic
      x-audience:
        - web
      x-owner: core-traffic
      x-permission: hnr.read.self
      x-credential-audience: web-session
      parameters:
        - name: status
          in: query
          required: false
          description: 默认只返回仍需关注的义务；all 可查看全部历史状态。
          schema:
            type: string
            enum:
              - all
              - open
              - tracking
              - grace
              - overdue
              - satisfied
              - exempt
            default: open
        - name: limit
          in: query
          required: false
          description: 当前页最多返回的义务数量。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: 上一页返回的不透明游标；不得自行拼接或修改。
          schema:
            type: string
            minLength: 34
            maxLength: 34
            pattern: ^[A-Za-z0-9_-]{34}$
      responses:
        '200':
          description: 只读 Core 用户安全投影；状态由同一 PostgreSQL 事务时刻派生， 不查询 Tracker 热路径，也不包含客户端、IP、策略或内部证据。
          headers:
            Cache-Control:
              description: 本人 H&R 响应不得由浏览器或中间缓存持久保存。
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HNRPage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
