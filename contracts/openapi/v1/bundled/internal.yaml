      x-credential-audience: anonymous
      parameters:
        - $ref: '#/components/parameters/TorrentIDPathParameter'
      responses:
        '200':
          description: 服务端从当前已配置的本地或对象存储读取首张截图，按 PostgreSQL 中的不可变长度与 SHA-256 证据完整校验后返回。对象键、后端位置、 版本号和存储凭据不会暴露给浏览器。
          headers:
            Cache-Control:
              description: 短期公共缓存；未来显式封面替换无需沿用旧对象。
              required: true
              schema:
                type: string
            ETag:
              description: 由不可变内容 SHA-256 生成的强校验标签。
              required: true
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
