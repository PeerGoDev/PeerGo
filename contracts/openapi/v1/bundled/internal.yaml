      schema:
        type: string
        format: uuid
    RSSTokenPathParameter:
      name: rss_token
      in: path
      required: true
      description: 256 位随机 RSS 令牌；服务端只保存 SHA-256 摘要。
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: ^[A-Za-z0-9_-]{43}$
    RSSTorrentIDPathParameter:
      name: torrent_id
