  /rss/{rss_token}:
    get:
      operationId: getRSSFeed
      summary: 读取一个固定过滤条件的私密 RSS 2.0 Feed
      tags:
        - rss
      x-audience:
        - rss
      x-owner: core-rss
      x-permission: rss.subscription.token
      x-credential-audience: rss-token
      parameters:
        - $ref: '#/components/parameters/RSSTokenPathParameter'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: 优惠状态冻结在缓存观察时刻，并在最近的优惠或置顶边界前失效。
          headers:
            ETag:
              required: true
              schema:
                type: string
            Last-Modified:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private
                  - no-cache
            Referrer-Policy:
              required: true
              schema:
                type: string
                enum:
                  - no-referrer
          content:
            application/rss+xml:
              schema:
                type: string
        '304':
          description: 内容未变化；令牌仍已校验且请求仍计入限流。
          headers:
            ETag:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private
                  - no-cache
            Referrer-Policy:
              required: true
              schema:
                type: string
                enum:
                  - no-referrer
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
