        - share_ratio_exempt
        - newcomer_assessment_exempt
        - speed_limit_exempt
        - seedbox_no_discount
      properties:
        seeding_reward_policy_revision:
          type: string
          maxLength: 64
        seeding_reward_bonus_bps:
          type: integer
          minimum: 0
          maximum: 100000
        free_download_enabled:
          type: boolean
        share_ratio_exempt:
          type: boolean
        newcomer_assessment_exempt:
          type: boolean
        speed_limit_exempt:
          type: boolean
        seedbox_no_discount:
          type: boolean
    EmailDeliveryStats:
      type: object
      additionalProperties: false
      required:
        - verification_pending
        - verification_sent
        - verification_failed
        - verification_verified
        - recovery_pending
        - recovery_sent
        - recovery_failed
        - recovery_completed
      properties:
        verification_pending:
          $ref: '#/components/schemas/OperationsCount'
        verification_sent:
          $ref: '#/components/schemas/OperationsCount'
        verification_failed:
          $ref: '#/components/schemas/OperationsCount'
        verification_verified:
          $ref: '#/components/schemas/OperationsCount'
        recovery_pending:
          $ref: '#/components/schemas/OperationsCount'
        recovery_sent:
          $ref: '#/components/schemas/OperationsCount'
        recovery_failed:
          $ref: '#/components/schemas/OperationsCount'
        recovery_completed:
          $ref: '#/components/schemas/OperationsCount'
  responses:
    ProblemResponse:
      description: 使用稳定 code 和 request_id 表达的 API 错误。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    WebCSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 与当前普通 Web 会话绑定的 CSRF token。
      schema:
        type: string
        minLength: 43
        maxLength: 43
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 浏览器为本次敏感变更生成并在安全重试时复用的 UUID。
      schema:
        type: string
        format: uuid
    StaffCSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 与当前 staff session 绑定的 CSRF token。
      schema:
        type: string
        minLength: 43
        maxLength: 43
    SeedboxReportIDPathParameter:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TorrentIDPathParameter:
      name: torrent_id
      in: path
      required: true
      description: 种子的唯一正整数 ID；迁移数据保留旧站 ID，新数据从当前最大值继续递增。
      schema:
        type: integer
        format: int64
        minimum: 1
    SocialPostIDPathParameter:
      name: post_id
      in: path
      required: true
      description: 动态的稳定公开 UUID。
      schema:
        type: string
        format: uuid
    CommentIDPathParameter:
      name: comment_id
      in: path
      required: true
      description: 评论的稳定公开 UUID。
      schema:
        type: string
        format: uuid
    GroupKindPathParameter:
      name: group_kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WorkgroupKind'
    AssignmentIDPathParameter:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RSSSubscriptionIDPathParameter:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TorrentCatalogIDPathParameter:
      name: torrent_id
      in: path
      required: true
      description: 公开目录种子的唯一正整数 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    ApplicationIDPathParameter:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIDPathParameter:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionIDPathParameter:
      name: submission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipIDPathParameter:
      name: membership_id
      in: path
      required: true
