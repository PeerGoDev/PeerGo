  /api/v1/torrents:
    get:
      operationId: listTorrents
      summary: 获取最新种子摘要
      tags:
        - catalog
      x-audience:
        - web
      x-owner: core-catalog
      x-permission: torrent.read
      x-credential-audience: anonymous
      parameters:
        - name: limit
          in: query
          description: 返回数量上限。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: query
          in: query
          description: 对名称和副标题进行不区分大小写的包含匹配。
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: search_scope
          in: query
          description: 关键词匹配范围；省略时同时匹配标题和副标题。
          required: false
          schema:
            type: string
            enum:
              - title_subtitle
              - title
              - subtitle
            default: title_subtitle
        - name: offset
          in: query
          description: 从匹配结果中跳过的数量，用于稳定分页。
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: category_id
          in: query
          description: 只返回指定启用分类的种子；省略时返回全部分类。
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,63}$
        - name: promotion
          in: query
          description: 只返回当前公开展示优惠匹配的种子；历史结算不读取此字段。
          required: false
          schema:
            type: string
            enum:
              - none
              - free
              - double_upload
              - double_upload_free
              - half_download
              - double_upload_half_download
              - thirty_percent_download
        - name: sort
          in: query
          description: 搜索结果排序；省略时按最新发布时间倒序。
          required: false
          schema:
            type: string
            enum:
              - published_desc
              - published_asc
              - size_desc
              - size_asc
              - completed_desc
            default: published_desc
      responses:
        '200':
          description: 最新种子与异步 swarm 统计快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentList'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
