CapabilityScope:
  type: object
  additionalProperties: false
  required: [type, id]
  properties:
    type:
      type: string
      enum: [site, category]
    id:
      type: string
      minLength: 1
      maxLength: 128

Capability:
  type: object
  additionalProperties: false
  required: [action, description, scope, expires_at]
  properties:
    action:
      $ref: "#/CapabilityAction"
    description:
      type: string
      minLength: 1
      maxLength: 200
    scope:
      $ref: "#/CapabilityScope"
    expires_at:
      type: string
      format: date-time

CapabilityList:
  type: object
  additionalProperties: false
  required: [policy_version, items]
  properties:
    policy_version:
      type: string
      minLength: 1
      maxLength: 64
    items:
      type: array
      maxItems: 256
      items:
        $ref: "#/Capability"

GrantScope:
  type: object
  additionalProperties: false
  required: [type, id]
  properties:
    type:
      type: string
      enum: [site, category]
    id:
      type: string
      minLength: 1
      maxLength: 128

GrantAdministrationGrant:
  type: object
  additionalProperties: false
  required:
    - id
    - subject_id
    - subject_username
    - subject_display_name
    - role_id
    - role_name
    - mandate_id
    - mandate_status
    - scope
    - valid_from
    - valid_until
    - version
  properties:
    id:
      type: string
      format: uuid
    subject_id:
      type: string
      format: uuid
    subject_username:
      type: string
      minLength: 1
      maxLength: 40
    subject_display_name:
      type: string
      minLength: 1
      maxLength: 80
    role_id:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,63}$"
    role_name:
      type: string
      minLength: 1
      maxLength: 80
    mandate_id:
      type: string
      format: uuid
    mandate_status:
      type: string
      enum: [active, suspended, expired, revoked]
    scope:
      $ref: "#/GrantScope"
    valid_from:
      type: string
      format: date-time
    valid_until:
      type: string
      format: date-time
    version:
      type: integer
      format: int64
      minimum: 1
    revoked_at:
      type: string
      format: date-time

GrantRevocationReview:
  type: object
  additionalProperties: false
  required: [id, reviewer_id, domain, decision, reason, created_at]
  properties:
    id:
      type: string
      format: uuid
    reviewer_id:
      type: string
      format: uuid
    domain:
      type: string
      enum: [governance, security]
    decision:
      type: string
      enum: [approve, reject]
    reason:
      type: string
      minLength: 10
      maxLength: 1000
    created_at:
      type: string
      format: date-time

GrantRevocationRequest:
  type: object
  additionalProperties: false
  required:
    - id
    - grant_id
    - expected_grant_version
    - target_subject_id
    - proposer_id
    - reason
    - status
    - created_at
    - expires_at
    - reviews
  properties:
    id:
      type: string
      format: uuid
    grant_id:
      type: string
      format: uuid
    expected_grant_version:
      type: integer
      format: int64
      minimum: 1
    resulting_grant_version:
      type: integer
      format: int64
      minimum: 2
    target_subject_id:
      type: string
      format: uuid
    proposer_id:
      type: string
      format: uuid
    reason:
      type: string
      minLength: 10
      maxLength: 1000
    status:
      type: string
      enum: [pending, rejected, applied, conflicted, expired]
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    resolved_at:
      type: string
      format: date-time
    reviews:
      type: array
      maxItems: 2
      items:
        $ref: "#/GrantRevocationReview"

GrantAdministrationOverview:
  type: object
  additionalProperties: false
  required: [policy_version, grants, requests]
  properties:
    policy_version:
      type: string
      minLength: 1
      maxLength: 64
    grants:
      type: array
      maxItems: 200
      items:
        $ref: "#/GrantAdministrationGrant"
    requests:
      type: array
      maxItems: 100
      items:
        $ref: "#/GrantRevocationRequest"

CreateGrantRevocationRequest:
  type: object
  additionalProperties: false
  required: [grant_id, expected_grant_version, reason]
  properties:
    grant_id:
      type: string
      format: uuid
    expected_grant_version:
      type: integer
      format: int64
      minimum: 1
    reason:
      type: string
      minLength: 10
      maxLength: 1000

ReviewGrantRevocationRequest:
  type: object
  additionalProperties: false
  required: [decision, reason]
  properties:
    decision:
      type: string
      enum: [approve, reject]
    reason:
      type: string
      minLength: 10
      maxLength: 1000
