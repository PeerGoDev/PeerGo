    origin:
      type: string
      enum: [legacy_migration, system_backfill, staff]
    reason_summary:
      type: string
      minLength: 10
      maxLength: 500
    enabled:
      type: boolean
    until:
      type: string
      format: date-time
      nullable: true
    state_version:
      type: integer
      format: int64
      minimum: 1
    occurred_at:
      type: string
      format: date-time
    actor_numeric_id:
      type: integer
      format: int64
      minimum: 1
    actor_username:
      type: string
      minLength: 1
      maxLength: 40

ChangeVIPRequest:
  type: object
  additionalProperties: false
  required:
    - enabled
    - reason
    - expected_user_version
    - expected_state_version
  properties:
    enabled:
      type: boolean
    duration_days:
      type: integer
      minimum: 1
      maximum: 3650
