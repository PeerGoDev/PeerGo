      type: string
      format: date-time

RecoveryCodeList:
  type: array
  minItems: 10
  maxItems: 10
  items:
    type: string
    pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
    readOnly: true

UserWebSession:
  type: object
  additionalProperties: false
  required: [id, current, created_at, last_seen_at, expires_at]
  properties:
    id:
      type: string
      format: uuid
      description: 与 bearer token 及其摘要无关的浏览器安全标识。
    current:
      type: boolean
    created_at:
      type: string
      format: date-time
    last_seen_at:
      type: string
      format: date-time
      description: 最多每五分钟合并更新，不构成逐请求活动轨迹。
    expires_at:
      type: string
      format: date-time

UserWebSessionList:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 256
      items:
        $ref: "#/UserWebSession"

WebAuthnCredentialDescriptor:
  type: object
  additionalProperties: false
  required: [type, id]
  properties:
    type:
      type: string
      enum: [public-key]
    id:
      type: string
      minLength: 1
      maxLength: 1400
      pattern: "^[A-Za-z0-9_-]+$"
    transports:
      type: array
      maxItems: 16
      items:
        type: string
        minLength: 1
        maxLength: 32

WebAuthnRequestOptions:
  type: object
  additionalProperties: false
  required: [challenge, timeout, rpId, allowCredentials, userVerification]
  properties:
    challenge:
      type: string
      minLength: 22
      maxLength: 1024
      pattern: "^[A-Za-z0-9_-]+$"
    timeout:
      type: integer
      minimum: 1000
      maximum: 600000
    rpId:
      type: string
      minLength: 1
      maxLength: 253
    allowCredentials:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: "#/WebAuthnCredentialDescriptor"
    userVerification:
      type: string
      enum: [required]
    hints:
      type: array
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 32
    extensions:
      type: object
      description: 标准 WebAuthn client extension inputs；由 RP library 生成。
      additionalProperties: true

StaffElevationOptions:
  type: object
  additionalProperties: false
  required: [challenge_id, expires_at, public_key]
  properties:
    challenge_id:
      type: string
      format: uuid
    expires_at:
      type: string
      format: date-time
    public_key:
      $ref: "#/WebAuthnRequestOptions"

WebAuthnAuthenticatorAssertionResponse:
  type: object
  additionalProperties: false
  required: [clientDataJSON, authenticatorData, signature]
  properties:
    clientDataJSON:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]+$"
    authenticatorData:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]+$"
    signature:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]+$"
    userHandle:
      type: string
      nullable: true
      maxLength: 1024
      pattern: "^[A-Za-z0-9_-]*$"

WebAuthnCredentialAssertion:
  type: object
  additionalProperties: false
  required: [id, rawId, type, response, clientExtensionResults]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 1400
      pattern: "^[A-Za-z0-9_-]+$"
    rawId:
      type: string
      minLength: 1
      maxLength: 1400
      pattern: "^[A-Za-z0-9_-]+$"
    type:
      type: string
      enum: [public-key]
    authenticatorAttachment:
      type: string
      nullable: true
      enum: [platform, cross-platform]
    response:
      $ref: "#/WebAuthnAuthenticatorAssertionResponse"
    clientExtensionResults:
      type: object
      description: 标准 WebAuthn client extension outputs；由 RP library 校验。
      additionalProperties: true

CompleteStaffElevationRequest:
  type: object
  additionalProperties: false
  required: [challenge_id, credential]
  properties:
    challenge_id:
      type: string
      format: uuid
    credential:
      $ref: "#/WebAuthnCredentialAssertion"

StaffSession:
  type: object
  additionalProperties: false
  required: [user, expires_at, authentication_method, authenticated_at, csrf_token]
  properties:
    user:
      $ref: "#/SessionUser"
    expires_at:
      type: string
      format: date-time
    authentication_method:
      type: string
      enum: [account_session, passkey]
      description: 普通账号登录，或可选的通行密钥增强验证。
    authenticated_at:
      type: string
      format: date-time
      description: 当前管理员身份最近一次完成验证的时间。
    webauthn_authenticated_at:
      type: string
      format: date-time
      nullable: true
      deprecated: true
      description: 兼容字段；仅通行密钥会话返回。
    csrf_token:
      type: string
      minLength: 43
      maxLength: 43
      description: 仅用于同源 staff 写请求；它不是身份凭据。

StaffBootstrapToken:
  type: string
  minLength: 43
  maxLength: 43
  pattern: "^[A-Za-z0-9_-]{43}$"
  writeOnly: true
  description: operator CLI 仅返回一次的 256-bit bootstrap token。

BeginStaffEnrollmentRequest:
  type: object
  additionalProperties: false
  required: [bootstrap_token, label]
  properties:
    bootstrap_token:
      $ref: "#/StaffBootstrapToken"
    label:
      type: string
      minLength: 1
      maxLength: 80

WebAuthnRelyingPartyEntity:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 253
    name:
      type: string
      minLength: 1
      maxLength: 80

WebAuthnUserEntity:
  type: object
  additionalProperties: false
  required: [id, name, displayName]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "^[A-Za-z0-9_-]+$"
    name:
      type: string
      minLength: 1
      maxLength: 64
    displayName:
      type: string
      minLength: 1
      maxLength: 80

WebAuthnCredentialParameter:
  type: object
  additionalProperties: false
  required: [type, alg]
  properties:
    type:
      type: string
      enum: [public-key]
    alg:
      type: integer
      minimum: -65536
      maximum: 65535

WebAuthnAuthenticatorSelection:
  type: object
  additionalProperties: false
  required: [residentKey, requireResidentKey, userVerification]
  properties:
    authenticatorAttachment:
      type: string
      enum: [platform, cross-platform]
    residentKey:
      type: string
      enum: [preferred]
    requireResidentKey:
      type: boolean
    userVerification:
      type: string
      enum: [required]

WebAuthnCreationOptions:
  type: object
  additionalProperties: false
  required:
    - rp
    - user
    - challenge
    - pubKeyCredParams
    - timeout
    - authenticatorSelection
    - attestation
  properties:
    rp:
      $ref: "#/WebAuthnRelyingPartyEntity"
    user:
      $ref: "#/WebAuthnUserEntity"
    challenge:
      type: string
      minLength: 22
      maxLength: 1024
      pattern: "^[A-Za-z0-9_-]+$"
    pubKeyCredParams:
      type: array
      minItems: 1
      maxItems: 32
      items:
        $ref: "#/WebAuthnCredentialParameter"
    timeout:
      type: integer
      minimum: 1000
      maximum: 600000
    excludeCredentials:
      type: array
      maxItems: 32
      items:
        $ref: "#/WebAuthnCredentialDescriptor"
    authenticatorSelection:
      $ref: "#/WebAuthnAuthenticatorSelection"
    hints:
      type: array
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 32
    attestation:
      type: string
      enum: [none]
    extensions:
      type: object
      additionalProperties: true

StaffEnrollmentOptions:
  type: object
  additionalProperties: false
  required: [challenge_id, expires_at, public_key]
  properties:
    challenge_id:
      type: string
      format: uuid
    expires_at:
      type: string
      format: date-time
    public_key:
      $ref: "#/WebAuthnCreationOptions"

WebAuthnAuthenticatorAttestationResponse:
  type: object
  additionalProperties: false
  required: [clientDataJSON, attestationObject]
  properties:
    clientDataJSON:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]+$"
    attestationObject:
      type: string
      minLength: 1
      maxLength: 32768
      pattern: "^[A-Za-z0-9_-]+$"
    transports:
      type: array
      maxItems: 16
      items:
        type: string
        minLength: 1
        maxLength: 32
    authenticatorData:
      type: string
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]*$"
    publicKey:
      type: string
      maxLength: 8192
      pattern: "^[A-Za-z0-9_-]*$"
    publicKeyAlgorithm:
      type: integer

WebAuthnCredentialCreation:
  type: object
  additionalProperties: false
  required: [id, rawId, type, response, clientExtensionResults]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 1400
      pattern: "^[A-Za-z0-9_-]+$"
    rawId:
      type: string
      minLength: 1
      maxLength: 1400
      pattern: "^[A-Za-z0-9_-]+$"
    type:
      type: string
      enum: [public-key]
    authenticatorAttachment:
      type: string
      nullable: true
      enum: [platform, cross-platform]
    response:
      $ref: "#/WebAuthnAuthenticatorAttestationResponse"
    clientExtensionResults:
      type: object
      additionalProperties: true

CompleteStaffEnrollmentRequest:
  type: object
  additionalProperties: false
  required: [bootstrap_token, challenge_id, credential]
  properties:
    bootstrap_token:
      $ref: "#/StaffBootstrapToken"
    challenge_id:
      type: string
      format: uuid
    credential:
      $ref: "#/WebAuthnCredentialCreation"

StaffCredentialEnrollment:
  type: object
  additionalProperties: false
  required: [label, enrolled_at]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 80
    enrolled_at:
      type: string
      format: date-time

ManagedUserStatus:
  type: string
  enum: [active, disabled, pending]

ManagedUserDirectoryFilter:
  type: string
  enum: [active, banned, pending, vip, download_restricted, unverified]

ManagedUserSummary:
  type: object
  additionalProperties: false
  required:
    - id
    - numeric_id
    - username
    - display_name
    - email
    - email_verified
    - banned
    - download_restricted
    - vip_enabled
    - vip_active
    - status
    - version
    - active_restriction_count
    - uploaded_bytes
    - downloaded_bytes
    - magic_balance
    - level
    - role_names
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
      description: PeerGo 规范 UUID；用于接口路径和跨模块引用。
    numeric_id:
      type: integer
      format: int64
      minimum: 1
      description: 后台数字 ID；迁移用户沿用 PtYes ID，新用户由 PeerGo 递增分配。
    username:
      type: string
      minLength: 1
      maxLength: 64
    display_name:
      type: string
      minLength: 1
      maxLength: 80
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: 仅对具有 user.account.read 的后台身份返回；地址由 Privacy Vault 按需提供，Core 不持久化。
    email_verified:
      type: boolean
    banned:
      type: boolean
      description: 账户是否处于封禁状态；旧站封禁迁移为 disabled 账户。
    download_restricted:
      type: boolean
      description: 是否禁止发起新的种子下载；与整站账户封禁相互独立。
    vip_enabled:
      type: boolean
      description: 是否存在 VIP 授予记录，包括已经到期的记录。
    vip_active:
      type: boolean
      description: VIP 授予在当前服务端时刻是否仍然有效。
    vip_until:
      type: string
      format: date-time
      nullable: true
      description: VIP 到期时间；启用且为空表示永久 VIP。
    status:
      $ref: "#/ManagedUserStatus"
    version:
      type: integer
      format: int64
      minimum: 1
    active_restriction_count:
      type: integer
      format: int64
      minimum: 0
    uploaded_bytes:
      type: string
      pattern: "^[0-9]+$"
      description: 实际累计上传字节数；使用十进制字符串避免前端整数精度损失。
    downloaded_bytes:
      type: string
      pattern: "^[0-9]+$"
      description: 实际累计下载字节数；使用十进制字符串避免前端整数精度损失。
    magic_balance:
      type: string
      pattern: "^-?[0-9]+$"
      description: 唯一站内资产魔力值，始终为整数。
    level:
      type: integer
      minimum: 1
      maximum: 99
    role_names:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 80
    last_active_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ManagedUserPage:
  type: object
  additionalProperties: false
  required: [items, total, page, page_size, summary]
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: "#/ManagedUserSummary"
    total:
      type: integer
      format: int64
      minimum: 0
    page:
      type: integer
      minimum: 1
      maximum: 100000
    page_size:
      type: integer
      minimum: 1
      maximum: 50
    summary:
      $ref: "#/ManagedUserDirectorySummary"

ManagedUserDirectorySummary:
  type: object
  additionalProperties: false
  required: [total, active, banned, vip, download_restricted, unverified]
  properties:
    total:
      type: integer
      format: int64
      minimum: 0
    active:
      type: integer
      format: int64
      minimum: 0
    banned:
      type: integer
      format: int64
      minimum: 0
    vip:
      type: integer
      format: int64
      minimum: 0
    download_restricted:
      type: integer
      format: int64
      minimum: 0
    unverified:
      type: integer
      format: int64
      minimum: 0

CurrentAccountRestriction:
