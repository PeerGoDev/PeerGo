RegistrationMode:
  type: string
  enum: [open, invite, closed]

EmailDomainMode:
  type: string
  enum: [any, allowlist, blocklist]

HumanVerificationProvider:
  type: string
  enum: [disabled, turnstile]

RegistrationPolicySettings:
  type: object
  additionalProperties: false
  required:
    - mode
    - member_invites_enabled
    - invite_valid_days
    - max_invites_per_member
    - minimum_invite_account_age_days
    - minimum_invite_level
    - username_min_characters
    - username_max_characters
    - reserved_usernames
    - email_domain_mode
    - email_domains
    - session_valid_hours
    - remember_session_valid_hours
    - human_verification_provider
    - human_verification_site_key
    - human_verification_registration_enabled
    - human_verification_login_enabled
    - human_verification_password_recovery_enabled
    - human_verification_secret_configured
    - version
    - updated_at
  properties:
    mode:
      $ref: "#/RegistrationMode"
    member_invites_enabled:
      type: boolean
    invite_valid_days:
      type: integer
      minimum: 1
      maximum: 90
    max_invites_per_member:
      type: integer
      minimum: 0
      maximum: 100
    minimum_invite_account_age_days:
      type: integer
      minimum: 0
      maximum: 3650
    minimum_invite_level:
      type: integer
      minimum: 1
      maximum: 99
    username_min_characters:
      type: integer
      minimum: 3
      maximum: 32
    username_max_characters:
      type: integer
      minimum: 3
      maximum: 32
    reserved_usernames:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{2,31}$'
    email_domain_mode:
      $ref: "#/EmailDomainMode"
    email_domains:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        maxLength: 253
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
    session_valid_hours:
      type: integer
      minimum: 1
      maximum: 720
    remember_session_valid_hours:
      type: integer
      minimum: 24
      maximum: 2160
    human_verification_provider:
      $ref: "#/HumanVerificationProvider"
    human_verification_site_key:
      type: string
      maxLength: 128
      description: 公开的 Turnstile site key；关闭人机验证时为空。
    human_verification_registration_enabled:
      type: boolean
    human_verification_login_enabled:
      type: boolean
    human_verification_password_recovery_enabled:
      type: boolean
    human_verification_secret_configured:
      type: boolean
      readOnly: true
      description: 仅表示 Core 已从部署密钥载入服务端 secret，不返回 secret 内容。
    version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    updated_at:
      type: string
      format: date-time

UpdateRegistrationPolicySettingsRequest:
  type: object
  additionalProperties: false
  required:
    - mode
    - member_invites_enabled
    - invite_valid_days
    - max_invites_per_member
    - minimum_invite_account_age_days
    - minimum_invite_level
    - username_min_characters
    - username_max_characters
    - reserved_usernames
    - email_domain_mode
    - email_domains
    - session_valid_hours
    - remember_session_valid_hours
    - human_verification_provider
    - human_verification_site_key
    - human_verification_registration_enabled
    - human_verification_login_enabled
    - human_verification_password_recovery_enabled
    - expected_version
    - reason
  properties:
    mode:
      $ref: "#/RegistrationMode"
    member_invites_enabled:
      type: boolean
    invite_valid_days:
      type: integer
      minimum: 1
      maximum: 90
    max_invites_per_member:
      type: integer
      minimum: 0
      maximum: 100
    minimum_invite_account_age_days:
      type: integer
      minimum: 0
      maximum: 3650
    minimum_invite_level:
      type: integer
      minimum: 1
      maximum: 99
    username_min_characters:
      type: integer
      minimum: 3
      maximum: 32
    username_max_characters:
      type: integer
      minimum: 3
      maximum: 32
    reserved_usernames:
      type: array
      maxItems: 200
      uniqueItems: true
      items:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{2,31}$'
    email_domain_mode:
      $ref: "#/EmailDomainMode"
    email_domains:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        maxLength: 253
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
    session_valid_hours:
      type: integer
      minimum: 1
      maximum: 720
    remember_session_valid_hours:
      type: integer
      minimum: 24
      maximum: 2160
    human_verification_provider:
      $ref: "#/HumanVerificationProvider"
    human_verification_site_key:
      type: string
      maxLength: 128
    human_verification_registration_enabled:
      type: boolean
    human_verification_login_enabled:
      type: boolean
    human_verification_password_recovery_enabled:
      type: boolean
    expected_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    reason:
      type: string
      minLength: 5
      maxLength: 500

InvitationStatus:
  type: string
  enum: [available, claimed, used, expired, revoked]

InvitationEligibilityBlocker:
  type: string
  enum:
    - none
    - disabled
    - account_unavailable
    - email_unverified
    - account_age
    - level
    - quota_exhausted

InvitationEligibility:
  type: object
  additionalProperties: false
  required:
    - enabled
    - eligible
    - blocker
    - invite_valid_days
    - max_invites_per_member
    - used_invites
    - remaining_invites
    - minimum_account_age_days
    - current_account_age_days
    - minimum_level
    - current_level
    - email_verified
  properties:
    enabled:
      type: boolean
    eligible:
      type: boolean
    blocker:
      $ref: "#/InvitationEligibilityBlocker"
    invite_valid_days:
      type: integer
      minimum: 1
      maximum: 90
    max_invites_per_member:
      type: integer
      minimum: 0
      maximum: 100
    used_invites:
      type: integer
      minimum: 0
      maximum: 1000000
    remaining_invites:
      type: integer
      minimum: 0
      maximum: 1000000
    minimum_account_age_days:
      type: integer
      minimum: 0
      maximum: 3650
    current_account_age_days:
      type: integer
      minimum: 0
    minimum_level:
      type: integer
      minimum: 1
      maximum: 99
    current_level:
      type: integer
      minimum: 1
      maximum: 99
    email_verified:
      type: boolean

MemberInvitation:
  type: object
  additionalProperties: false
  required: [id, source, status, email_bound, created_at, expires_at]
  properties:
    id:
      type: string
      format: uuid
    source:
      type: string
      enum: [member, legacy_import]
    status:
      $ref: "#/InvitationStatus"
    email_bound:
      type: boolean
      description: 邀请凭证是否仅允许签发时指定的邮箱完成注册；不返回邮箱明文。
    invitee_username:
      type: string
      minLength: 3
      maxLength: 32
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    claimed_at:
      type: string
      format: date-time
    consumed_at:
      type: string
      format: date-time
    revoked_at:
      type: string
      format: date-time

InvitationRelationshipSource:
  type: string
  enum: [registration, legacy_import]

InvitedMember:
  type: object
  additionalProperties: false
  required: [numeric_id, username, display_name, source, established_at]
  properties:
    numeric_id:
      type: integer
      format: int64
      minimum: 1
    username:
      type: string
      minLength: 1
      maxLength: 64
    display_name:
      type: string
      minLength: 1
      maxLength: 80
    source:
      $ref: "#/InvitationRelationshipSource"
    established_at:
      type: string
      format: date-time

HistoricalInvitationReward:
  type: object
  additionalProperties: false
  required: [amount, source_rows]
  properties:
    amount:
      type: string
      pattern: "^(0|[1-9][0-9]{0,18})$"
      description: 已包含在用户期初魔力值中的历史整数合计，不会再次入账。
    source_rows:
      type: integer
      format: int64
      minimum: 0
    last_rewarded_at:
      type: string
      format: date-time

InvitationNetwork:
  type: object
  additionalProperties: false
  required:
    [
      direct_members,
      ancestor_members,
      direct_count,
      total_descendants,
      harem_reward,
      invitation_reward,
    ]
  properties:
    direct_members:
      type: array
      maxItems: 100
      items:
        $ref: "#/InvitedMember"
    ancestor_members:
      type: array
      maxItems: 32
      description: 从直属上家开始，按距离由近到远排列的邀请链。
      items:
        $ref: "#/InvitedMember"
    direct_count:
      type: integer
      minimum: 0
    total_descendants:
      type: integer
      minimum: 0
    harem_reward:
      $ref: "#/HistoricalInvitationReward"
    invitation_reward:
      $ref: "#/HistoricalInvitationReward"

InvitationOverview:
  type: object
  additionalProperties: false
  required: [eligibility, items, network, total, limit, offset, observed_at]
  properties:
    eligibility:
      $ref: "#/InvitationEligibility"
    items:
      type: array
      items:
        $ref: "#/MemberInvitation"
    network:
      $ref: "#/InvitationNetwork"
    total:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
    offset:
      type: integer
      minimum: 0
      maximum: 99999
    observed_at:
      type: string
      format: date-time

InvitationIssueResult:
  type: object
  additionalProperties: false
  required: [invitation, token]
  properties:
    invitation:
      $ref: "#/MemberInvitation"
    token:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: 只在成功签发响应中返回一次，之后无法找回。

IssueInvitationRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      description: 本邀请码唯一允许注册的邮箱；Core 仅保存不可枚举的绑定摘要。

CreateRegistrationRequest:
  type: object
  additionalProperties: false
  required: [username, display_name, email, password]
  properties:
    username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
      description: 登录名；服务端统一转为小写。
    display_name:
      type: string
      minLength: 1
      maxLength: 40
    email:
      type: string
      format: email
      maxLength: 254
      writeOnly: true
    password:
      type: string
      minLength: 12
      maxLength: 1024
      writeOnly: true
    invitation_token:
      type: string
      minLength: 43
      maxLength: 64
      pattern: "^([A-Za-z0-9_-]{43}|[0-9a-f]{64})$"
      description: 邀请注册时必填；同时兼容 PeerGo 的 43 位凭证与迁移期内仍有效的 Rousi 64 位凭证。
      writeOnly: true
    human_verification_token:
      type: string
      minLength: 1
      maxLength: 2048
      writeOnly: true
      description: 当前注册政策启用人机验证时，由浏览器小组件签发的一次性令牌。

RegistrationResult:
  type: object
  additionalProperties: false
  required: [user, admission_mode, email_verification_required, completed_at]
  properties:
    user:
      $ref: "#/SessionUser"
    admission_mode:
      $ref: "#/RegistrationMode"
    email_verification_required:
      type: boolean
    completed_at:
      type: string
      format: date-time

RequestEmailVerificationRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      writeOnly: true
      description: >-
        必须重新输入当前账户保存的邮箱；Core 仅转发到 Vault，不持久化。

EmailVerificationDispatch:
  type: object
  additionalProperties: false
  required: [accepted_at, next_request_at, already_verified]
  properties:
    accepted_at:
      type: string
      format: date-time
    next_request_at:
      type: string
      format: date-time
    already_verified:
      type: boolean

ConfirmEmailVerificationRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
      writeOnly: true

EmailVerificationResult:
  type: object
  additionalProperties: false
  required: [user, verified_at, already_verified]
  properties:
    user:
      $ref: "#/SessionUser"
    verified_at:
      type: string
      format: date-time
    already_verified:
      type: boolean

RequestPasswordRecoveryRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      writeOnly: true
      description: >-
        重新输入的注册邮箱；Core 只转发到 Vault，不持久化或返回。
    human_verification_token:
      type: string
      minLength: 1
      maxLength: 2048
      writeOnly: true

PasswordRecoveryDispatch:
  type: object
  additionalProperties: false
  required: [accepted_at, next_request_at]
  properties:
    accepted_at:
      type: string
      format: date-time
    next_request_at:
      type: string
      format: date-time

ConfirmPasswordRecoveryRequest:
  type: object
  additionalProperties: false
  required: [token, new_password]
  properties:
    token:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
      writeOnly: true
    new_password:
      type: string
      minLength: 12
      maxLength: 1024
      writeOnly: true

PasswordRecoveryResult:
  type: object
  additionalProperties: false
  required: [completed_at, already_completed]
  properties:
    completed_at:
      type: string
      format: date-time
    already_completed:
      type: boolean

CreateSessionRequest:
  type: object
  additionalProperties: false
  required: [identifier, password, remember_me]
  properties:
    identifier:
      type: string
      minLength: 1
      maxLength: 254
      description: 用户名或邮箱；服务端不会在错误响应中暴露命中情况。
    password:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
    second_factor_code:
      type: string
      minLength: 6
      maxLength: 32
      description: 六位 TOTP 或一次性恢复码；只有启用两步验证的账户需要。
      writeOnly: true
    remember_me:
      type: boolean
    human_verification_token:
      type: string
      minLength: 1
      maxLength: 2048
      writeOnly: true

AccountAccessCredentialProof:
  type: object
  additionalProperties: false
  required: [identifier, password]
  properties:
    identifier:
      type: string
      minLength: 1
      maxLength: 254
    password:
      type: string
      minLength: 1
      maxLength: 1024
      writeOnly: true
    second_factor_code:
      type: string
      minLength: 6
      maxLength: 32
      writeOnly: true

InspectAccountAccessRequest:
  type: object
  additionalProperties: false
  required: [credentials]
  properties:
    credentials:
      $ref: "#/AccountAccessCredentialProof"

SubmitAccountAccessAppealRequest:
  type: object
  additionalProperties: false
  required: [credentials, statement]
  properties:
    credentials:
      $ref: "#/AccountAccessCredentialProof"
    statement:
      type: string
      minLength: 20
      maxLength: 1000

AccountAccessSourceKind:
  type: string
  enum: [temporary_restriction, disabled_account, manual_download_restriction]

AccountAccessAppealStatus:
  type: string
  enum: [pending, approved, rejected, source_resolved]

AccountAccessRestriction:
  type: object
  additionalProperties: false
  required: [source_kind, reason_code, reason_summary, starts_at, expires_at, source_version]
  properties:
    source_kind: { $ref: "#/AccountAccessSourceKind" }
    reason_code: { type: string, minLength: 1, maxLength: 80 }
    reason_summary: { type: string, minLength: 2, maxLength: 500 }
    starts_at: { type: string, format: date-time }
    expires_at:
      type: string
      format: date-time
      nullable: true
    source_version: { type: integer, format: int64, minimum: 1 }

AccountAccessAppeal:
  type: object
  additionalProperties: false
  required:
    [id, user_id, user_numeric_id, username, restriction, statement, status,
     response, created_at, resolved_at, source_active, replayed]
  properties:
    id: { type: string, format: uuid }
    user_id: { type: string, format: uuid }
    user_numeric_id: { type: integer, format: int64, minimum: 1 }
    username: { type: string, minLength: 1, maxLength: 64 }
    restriction: { $ref: "#/AccountAccessRestriction" }
    statement: { type: string, minLength: 20, maxLength: 1000 }
    status: { $ref: "#/AccountAccessAppealStatus" }
    response: { type: string, maxLength: 1000 }
    created_at: { type: string, format: date-time }
    resolved_at:
      type: string
      format: date-time
      nullable: true
    source_active: { type: boolean }
    replayed: { type: boolean }

AccountAccessStatus:
  type: object
  additionalProperties: false
  required: [restricted, restriction, appeal, can_appeal]
  properties:
    restricted: { type: boolean }
    restriction:
      type: object
      allOf: [{ $ref: "#/AccountAccessRestriction" }]
      nullable: true
    appeal:
      type: object
      allOf: [{ $ref: "#/AccountAccessAppeal" }]
      nullable: true
    can_appeal: { type: boolean }

DownloadRestrictionSources:
  type: object
  additionalProperties: false
  required: [manual_or_legacy, ratio_watch, hit_and_run]
  properties:
    manual_or_legacy: { type: boolean }
    ratio_watch: { type: boolean }
    hit_and_run: { type: boolean }

DownloadRestrictionStatus:
  type: object
  additionalProperties: false
  required: [restricted, sources, restriction, appeal, can_appeal]
  properties:
    restricted: { type: boolean }
    sources: { $ref: "#/DownloadRestrictionSources" }
    restriction:
      type: object
      allOf: [{ $ref: "#/AccountAccessRestriction" }]
      nullable: true
    appeal:
      type: object
      allOf: [{ $ref: "#/AccountAccessAppeal" }]
      nullable: true
    can_appeal: { type: boolean }

SubmitDownloadRestrictionAppealRequest:
  type: object
  additionalProperties: false
  required: [statement]
  properties:
    statement:
      type: string
      minLength: 20
      maxLength: 1000

AccountAccessAppealFilter:
  type: string
  enum: [all, pending, resolved]

AccountAccessAppealPage:
  type: object
  additionalProperties: false
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      maxItems: 50
      items: { $ref: "#/AccountAccessAppeal" }
    total: { type: integer, format: int64, minimum: 0 }
    limit: { type: integer, minimum: 1, maximum: 50 }
    offset: { type: integer, minimum: 0, maximum: 1000000 }

DecideAccountAccessAppealRequest:
  type: object
  additionalProperties: false
  required: [decision, expected_source_version, response]
  properties:
    decision:
      type: string
      enum: [approved, rejected]
    expected_source_version: { type: integer, format: int64, minimum: 1 }
    response: { type: string, minLength: 10, maxLength: 1000 }

SessionUser:
  type: object
  additionalProperties: false
  required: [id, username, display_name, email_verified]
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 1
      maxLength: 64
    display_name:
      type: string
      minLength: 1
      maxLength: 80
    email_verified:
      type: boolean

UpdateMyProfileRequest:
  type: object
  additionalProperties: false
  required: [display_name]
  properties:
    display_name:
      type: string
      minLength: 1
      maxLength: 40
      description: 公开昵称；服务端会移除首尾空白。

AvatarRevision:
  type: object
  additionalProperties: false
  required: [revision, updated_at]
  properties:
    revision:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
      description: 公开缓存版本；不暴露对象存储位置。
    updated_at:
      type: string
      format: date-time

WebSession:
  type: object
  additionalProperties: false
  required: [user, expires_at, csrf_token]
  properties:
    user:
      $ref: "#/SessionUser"
    expires_at:
      type: string
      format: date-time
    csrf_token:
      type: string
      minLength: 43
      maxLength: 43
      description: 仅用于同源写请求；它不是身份凭据。

PublicUserProfile:
  type: object
  additionalProperties: false
  required:
    [numeric_id, username, display_name, joined_at, published_torrent_count, published_torrents]
  properties:
    numeric_id:
      type: integer
      format: int64
      minimum: 1
      description: 站内公开数字用户编号。
    username:
      type: string
      minLength: 1
      maxLength: 64
    display_name:
      type: string
      minLength: 1
      maxLength: 80
    joined_at:
      type: string
      format: date-time
    published_torrent_count:
      type: integer
      format: int64
      minimum: 0
      description: 当前可公开且非匿名发布的种子数量。
    published_torrents:
      type: array
      maxItems: 10
      description: 最近公开且非匿名发布的种子；审核中和匿名发布不会出现。
      items:
        $ref: "#/PublicUserPublishedTorrent"

PublicUserPublishedTorrent:
  type: object
  additionalProperties: false
  required: [id, title, subtitle, category, total_size_bytes, published_at]
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    category:
      $ref: "./catalog.yaml#/Category"
    total_size_bytes:
      type: integer
      format: int64
      minimum: 1
    published_at:
      type: string
      format: date-time

AccountSecurityOverview:
  type: object
  additionalProperties: false
  required: [email_verified, password_changed_at, two_factor]
  properties:
    email_verified:
      type: boolean
    password_changed_at:
      type: string
      format: date-time
    two_factor:
      $ref: "#/TwoFactorStatus"

TwoFactorStatus:
  type: object
  additionalProperties: false
  required: [enabled, enabled_at, recovery_codes_remaining]
  properties:
    enabled:
      type: boolean
    enabled_at:
      type: string
      format: date-time
      nullable: true
    recovery_codes_remaining:
      type: integer
      format: int64
      minimum: 0
      maximum: 32

StartTOTPEnrollmentRequest:
  type: object
  additionalProperties: false
  required: [password]
  properties:
    password:
      type: string
