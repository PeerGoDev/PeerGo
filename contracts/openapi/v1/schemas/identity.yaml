    reason:
      type: string
      minLength: 10
      maxLength: 500
    expected_user_version:
      type: integer
      format: int64
      minimum: 1
    expected_state_version:
      type: integer
      format: int64
      minimum: 0

ManualDownloadRestrictionOrigin:
