  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      enum: [account_access]
    reason_code:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
    reason_summary:
      type: string
      minLength: 10
      maxLength: 240
    starts_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    version:
      type: integer
      format: int64
      minimum: 1

ManagedUserDetail:
  allOf:
    - $ref: "#/ManagedUserSummary"
    - type: object
      additionalProperties: false
      required:
        - active_restrictions
        - manual_download_restriction
        - manual_download_restriction_history
        - vip_state
        - vip_history
      properties:
        active_restrictions:
          type: array
          maxItems: 50
          items:
            $ref: "#/CurrentAccountRestriction"
        manual_download_restriction:
          $ref: "#/ManualDownloadRestrictionState"
        manual_download_restriction_history:
          type: array
          maxItems: 20
          items:
            $ref: "#/ManualDownloadRestrictionTransition"
        vip_state:
