        vip_history:
          type: array
          maxItems: 20
          items:
            $ref: "#/VIPTransition"

VIPState:
  type: object
  additionalProperties: false
  required: [enabled, active, version]
  properties:
    enabled:
      type: boolean
    active:
      type: boolean
    until:
      type: string
      format: date-time
      nullable: true
    version:
      type: integer
      format: int64
      minimum: 0

VIPTransition:
  type: object
  additionalProperties: false
