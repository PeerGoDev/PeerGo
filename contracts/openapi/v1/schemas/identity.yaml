      type: integer
      format: int64
      minimum: 1
    occurred_at:
      type: string
      format: date-time
    actor_numeric_id:
      type: integer
      format: int64
      minimum: 1
    actor_username:
      type: string
      minLength: 1
      maxLength: 40

ChangeManualDownloadRestrictionRequest:
