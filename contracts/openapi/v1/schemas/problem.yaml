Problem:
  type: object
  required: [type, title, status, code, request_id]
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
    code:
      type: string
      pattern: "^[a-z0-9_]+$"
    request_id:
      type: string
