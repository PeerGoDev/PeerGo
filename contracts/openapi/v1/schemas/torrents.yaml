TorrentSubmissionRequest:
  type: object
  additionalProperties: false
  required:
    - category_id
    - title
    - torrent_file
  properties:
    category_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
      default: ""
    description:
      type: string
      maxLength: 4194304
      default: ""
      description: Markdown 正文；服务端同时按 UTF-8 字节长度执行持久化上限。
    media_info:
      type: string
      maxLength: 16777216
      default: ""
    anonymous:
      type: boolean
      default: false
    imdb_id:
      type: string
      pattern: "^tt[0-9]{7,10}$"
    tmdb_id:
      type: string
      pattern: "^[0-9]{1,20}$"
    douban_id:
      type: string
      pattern: "^[0-9]{1,20}$"
    facet_selections:
      type: array
      maxItems: 20
      items:
        $ref: "#/TorrentFacetSelectionInput"
    screenshots:
      type: array
      maxItems: 6
      description: 按顺序提交的种子截图；第一张作为封面。服务端按真实文件内容校验格式、尺寸与大小。
      items:
        type: string
        format: binary
        minLength: 1
        maxLength: 2097152
    torrent_file:
      type: string
      format: binary
      minLength: 1
      maxLength: 16777216

TorrentFacetSelectionInput:
  type: object
  additionalProperties: false
  required: [facet_id, option_keys]
  properties:
    facet_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    option_keys:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 80

TorrentSubmission:
  type: object
  additionalProperties: false
  required:
    - id
    - info_hash_v1
    - state
    - content_name
    - total_size_bytes
    - file_count
    - submitted_at
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    info_hash_v1:
      type: string
      pattern: "^[0-9a-f]{40}$"
    state:
      type: string
      enum: [pending_review, published]
      description: 普通成员提交后等待审核；有效转种组成员通过全部机器校验后直接发布。
    content_name:
      type: string
      minLength: 1
      maxLength: 255
    total_size_bytes:
      type: integer
      format: int64
      minimum: 1
    file_count:
      type: integer
      minimum: 1
      maximum: 100000
    submitted_at:
      type: string
      format: date-time

TorrentLifecycleState:
  type: string
  enum: [pending_review, published, rejected, disabled, deleted]

TorrentReviewReasonCode:
  type: string
  enum:
    - meets_requirements
    - metadata_incomplete
    - duplicate_or_superseded
    - content_policy_violation
    - quality_requirements_not_met
    - uploader_action_required
    - other

TorrentPublicFacet:
  type: object
  additionalProperties: false
  required: [facet_id, facet_name, option_key, option_label]
  properties:
    facet_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    facet_name:
      type: string
      minLength: 1
      maxLength: 40
    option_key:
      type: string
      minLength: 1
      maxLength: 80
    option_label:
      type: string
      minLength: 1
      maxLength: 80

TorrentExternalIdentifier:
  type: object
  additionalProperties: false
  required: [provider, external_id]
  properties:
    provider:
      type: string
      enum: [imdb, tmdb, douban, bangumi, steam]
    external_id:
      type: string
      minLength: 1
      maxLength: 64

TorrentPublicDetail:
  type: object
  additionalProperties: false
  required:
    - id
    - category
    - title
    - subtitle
    - content_name
    - uploader_display_name
    - anonymous
    - promotion
    - promotion_ends_at
    - sticky_until
    - facets
    - external_identifiers
    - info_hash_v1
    - total_size_bytes
    - payload_size_bytes
    - file_count
    - padding_file_count
    - screenshot_count
    - piece_length_bytes
    - piece_count
    - state
    - submitted_at
    - published_at
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    category:
      $ref: "../schemas/catalog.yaml#/Category"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    content_name:
      type: string
      minLength: 1
      maxLength: 255
    uploader_display_name:
      type: string
      minLength: 1
      maxLength: 80
      description: 匿名发布时固定返回“匿名”，不会暴露真实发布者名称。
    anonymous:
      type: boolean
    promotion:
      type: string
      enum:
        - none
        - free
        - double_upload
        - double_upload_free
        - half_download
        - double_upload_half_download
        - thirty_percent_download
      description: 当前公开展示优惠；历史流量结算不读取此字段。
    promotion_ends_at:
      type: string
      format: date-time
      nullable: true
      description: 当前公开展示优惠的到期时间；永久或无优惠时为 null。
    sticky_until:
      type: string
      format: date-time
      nullable: true
      description: 当前用户付费列表置顶的结束时间；未置顶时为 null。
    facets:
      type: array
      maxItems: 50
      items:
        $ref: "#/TorrentPublicFacet"
    external_identifiers:
      type: array
      maxItems: 5
      items:
        $ref: "#/TorrentExternalIdentifier"
    info_hash_v1:
      type: string
      pattern: "^[0-9a-f]{40}$"
    total_size_bytes:
      type: integer
      format: int64
      minimum: 1
    payload_size_bytes:
      type: integer
      format: int64
      minimum: 1
    file_count:
      type: integer
      minimum: 1
      maximum: 100000
    padding_file_count:
      type: integer
      minimum: 0
      maximum: 100000
    screenshot_count:
      type: integer
      minimum: 0
      maximum: 6
      description: 已发布种子的公开截图数量；位置 0 同时作为封面。
    piece_length_bytes:
      type: integer
      format: int64
      minimum: 1
    piece_count:
      type: integer
      minimum: 1
    state:
      type: string
      enum: [published]
    submitted_at:
      type: string
      format: date-time
    published_at:
      type: string
      format: date-time

TorrentPublicContent:
  type: object
  additionalProperties: false
  required: [torrent_id, description, description_format, media_info]
  properties:
    torrent_id:
      type: integer
      format: int64
      minimum: 1
    description:
      type: string
      maxLength: 4194304
    description_format:
      type: string
      enum: [markdown, plain_text]
    media_info:
      type: string
      maxLength: 16777216

TorrentRelatedVersions:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 10
      items:
        $ref: "../schemas/catalog.yaml#/TorrentSummary"

TorrentSwarmOverview:
  type: object
  additionalProperties: false
  required:
    - torrent_id
    - seeders
    - leechers
    - completed
    - observed_at
    - stale
    - confidence
  properties:
    torrent_id:
      type: integer
      format: int64
      minimum: 1
    seeders:
      type: integer
      minimum: 0
    leechers:
      type: integer
      minimum: 0
    completed:
      type: integer
      minimum: 0
    observed_at:
      type: string
      format: date-time
      nullable: true
      description: 最近一次完整统计的时间；尚无统计时为 null。
    stale:
      type: boolean
      description: true 表示统计尚未生成或已经超过服务端的新鲜度阈值。
    confidence:
      type: string
      enum: [fresh, stale, unavailable]
      description: fresh 为近期完整统计，stale 为过期完整统计，unavailable 为尚无完整统计。

TorrentFile:
  type: object
  additionalProperties: false
  required: [file_index, display_path, size_bytes, is_padding]
  properties:
    file_index:
      type: integer
      minimum: 0
      maximum: 99999
    display_path:
      type: string
      minLength: 1
      maxLength: 4096
    size_bytes:
      type: integer
      format: int64
      minimum: 0
    is_padding:
      type: boolean

TorrentFilePage:
  type: object
  additionalProperties: false
  required: [torrent_id, items, total, limit, offset]
  properties:
    torrent_id:
      type: integer
      format: int64
      minimum: 1
    items:
      type: array
      maxItems: 100
      items:
        $ref: "#/TorrentFile"
    total:
      type: integer
      minimum: 1
      maximum: 100000
    limit:
      type: integer
      minimum: 1
      maximum: 100
    offset:
      type: integer
      minimum: 0
      maximum: 99999

TorrentReviewFeedback:
  type: object
  additionalProperties: false
  required: [outcome, reason_code, reason, decided_at]
  properties:
    outcome:
      type: string
      enum: [published, rejected]
    reason_code:
      $ref: "#/TorrentReviewReasonCode"
    reason:
      type: string
      minLength: 10
      maxLength: 1000
    decided_at:
      type: string
      format: date-time

MyTorrentSubmission:
  type: object
  additionalProperties: false
  required:
    - id
    - category
    - title
    - subtitle
    - content_name
    - info_hash_v1
    - total_size_bytes
    - file_count
    - state
    - version
    - submitted_at
    - published_at
    - state_changed_at
    - latest_review
    - latest_content_change
    - latest_screenshot_change
    - latest_withdrawal
    - resubmission_allowed
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    category:
      $ref: "../schemas/catalog.yaml#/Category"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    content_name:
      type: string
      minLength: 1
      maxLength: 255
    info_hash_v1:
      type: string
      pattern: "^[0-9a-f]{40}$"
    total_size_bytes:
      type: integer
      format: int64
      minimum: 1
    file_count:
      type: integer
      minimum: 1
      maximum: 100000
    state:
      $ref: "#/TorrentLifecycleState"
    version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    submitted_at:
      type: string
      format: date-time
    published_at:
      type: string
      format: date-time
      nullable: true
    state_changed_at:
      type: string
      format: date-time
    latest_review:
      type: object
      allOf:
        - $ref: "#/TorrentReviewFeedback"
      nullable: true
    latest_content_change:
      type: object
      allOf:
        - $ref: "#/MyPublishedTorrentContentChangeStatus"
      nullable: true
    latest_screenshot_change:
      type: object
      allOf:
        - $ref: "#/MyPublishedTorrentScreenshotChangeStatus"
      nullable: true
    latest_withdrawal:
      type: object
      allOf:
        - $ref: "#/MyTorrentWithdrawalStatus"
      nullable: true
    resubmission_allowed:
      type: boolean
      description: 当前驳回结果是否允许只修改发布资料并重新送审；最终仍需独立写权限。

MyPublishedTorrentContentChangeStatus:
  type: object
  additionalProperties: false
  required: [status, submitted_at, decided_at, decision_reason]
  properties:
    status:
      $ref: "#/PublishedTorrentContentChangeStatus"
    submitted_at:
      type: string
      format: date-time
    decided_at:
      type: string
      format: date-time
      nullable: true
    decision_reason:
      type: string
      nullable: true
      description: 仅在已批准或已驳回时返回审核说明；不包含审核员身份。

MyPublishedTorrentScreenshotChangeStatus:
  type: object
  additionalProperties: false
  required: [status, submitted_at, decided_at, decision_reason]
  properties:
    status:
      $ref: "#/PublishedTorrentScreenshotChangeStatus"
    submitted_at:
      type: string
      format: date-time
    decided_at:
      type: string
      format: date-time
      nullable: true
    decision_reason:
      type: string
      nullable: true
      description: 仅在附件修改已经处理后返回审核说明；不包含审核员身份。

MyTorrentWithdrawalStatus:
  type: object
  additionalProperties: false
  required: [status, submitted_at, decided_at, decision_reason]
  properties:
    status:
      $ref: "#/TorrentWithdrawalStatus"
    submitted_at:
      type: string
      format: date-time
    decided_at:
      type: string
      format: date-time
      nullable: true
    decision_reason:
      type: string
      nullable: true
      description: 仅在审核完成后返回处理说明；不包含审核员身份和授权证据。

MyTorrentSubmissionPage:
  type: object
  additionalProperties: false
  required: [items, total, limit]
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: "#/MyTorrentSubmission"
    total:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 50

TorrentResubmissionRequest:
  type: object
  additionalProperties: false
  required:
    - expected_version
    - category_id
    - title
    - subtitle
    - correction_note
  properties:
    expected_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    category_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    correction_note:
      type: string
      minLength: 10
      maxLength: 1000

TorrentResubmission:
  type: object
  additionalProperties: false
  required:
    - id
    - torrent_id
    - state
    - version
    - category_id
    - title
    - subtitle
    - review_requested_at
  properties:
    id:
      type: string
      format: uuid
    torrent_id:
      type: integer
      format: int64
      minimum: 1
    state:
      type: string
      enum: [pending_review]
    version:
      type: integer
      format: int64
      minimum: 2
      maximum: 9007199254740991
    category_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    review_requested_at:
      type: string
      format: date-time

UpdatePublishedTorrentMetadataRequest:
  type: object
  additionalProperties: false
  required: [expected_version, category_id, title, subtitle, reason]
  properties:
    expected_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    category_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    title:
      type: string
      minLength: 1
      maxLength: 240
    subtitle:
      type: string
      maxLength: 300
    reason:
      type: string
      minLength: 10
      maxLength: 1000

PublishedTorrentMetadataRevision:
  type: object
  additionalProperties: false
  required: [id, torrent_id, version, category_id, title, subtitle, reason, updated_at]
  properties:
    id: { type: string, format: uuid }
    torrent_id: { type: integer, format: int64, minimum: 1 }
    version:
      type: integer
      format: int64
      minimum: 2
      maximum: 9007199254740991
    category_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    title: { type: string, minLength: 1, maxLength: 240 }
    subtitle: { type: string, maxLength: 300 }
    reason: { type: string, minLength: 10, maxLength: 1000 }
    updated_at: { type: string, format: date-time }

PublishedTorrentContentSnapshot:
  type: object
  additionalProperties: false
  required: [description, media_info, external_identifiers]
  properties:
    description:
      type: string
      maxLength: 4194304
    media_info:
      type: string
      maxLength: 16777216
    external_identifiers:
      type: array
      maxItems: 5
      items:
        $ref: "#/TorrentExternalIdentifier"

SubmitPublishedTorrentContentChangeRequest:
  type: object
  additionalProperties: false
  required: [expected_version, description, media_info, external_identifiers, reason]
  properties:
    expected_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    description:
      type: string
      minLength: 1
      maxLength: 4194304
    media_info:
      type: string
      maxLength: 16777216
    external_identifiers:
      type: array
      maxItems: 5
      items:
        $ref: "#/TorrentExternalIdentifier"
    reason:
      type: string
      minLength: 10
      maxLength: 1000

PublishedTorrentContentChangeStatus:
  type: string
  enum: [pending, approved, rejected]

PublishedTorrentContentChange:
  type: object
  additionalProperties: false
  required:
    - id
    - torrent_id
    - base_torrent_version
    - base
    - candidate
    - reason
    - status
    - version
    - created_at
  properties:
    id: { type: string, format: uuid }
    torrent_id: { type: integer, format: int64, minimum: 1 }
    base_torrent_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    base:
      $ref: "#/PublishedTorrentContentSnapshot"
    candidate:
      $ref: "#/PublishedTorrentContentSnapshot"
    reason: { type: string, minLength: 10, maxLength: 1000 }
    status:
      $ref: "#/PublishedTorrentContentChangeStatus"
    version:
      type: integer
      format: int64
      minimum: 1
      maximum: 2
    created_at: { type: string, format: date-time }
    decided_at:
      type: string
      format: date-time
      nullable: true
      default: null

ManagedPublishedTorrentContentChange:
  type: object
  additionalProperties: false
  required:
    - change
    - uploader_numeric_id
    - uploader_username
    - uploader_display_name
    - torrent_title
  properties:
    change:
      $ref: "#/PublishedTorrentContentChange"
    uploader_numeric_id: { type: integer, format: int64, minimum: 1 }
    uploader_username: { type: string, minLength: 1, maxLength: 64 }
    uploader_display_name: { type: string, minLength: 1, maxLength: 80 }
    torrent_title: { type: string, minLength: 1, maxLength: 240 }

ManagedPublishedTorrentContentChangePage:
  type: object
  additionalProperties: false
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: "#/ManagedPublishedTorrentContentChange"
    total: { type: integer, format: int64, minimum: 0 }
    limit: { type: integer, minimum: 1, maximum: 50 }
    offset: { type: integer, minimum: 0, maximum: 1000000 }

DecidePublishedTorrentContentChangeRequest:
  type: object
  additionalProperties: false
  required: [expected_request_version, decision, reason]
  properties:
    expected_request_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 1
    decision:
      type: string
      enum: [approve, reject]
    reason:
      type: string
      minLength: 10
      maxLength: 1000

PublishedTorrentContentChangeDecisionResult:
  type: object
  additionalProperties: false
  required:
    - decision_id
    - request_id
    - torrent_id
    - decision
    - request_status
    - request_version
    - torrent_version
    - decided_at
  properties:
    decision_id: { type: string, format: uuid }
    request_id: { type: string, format: uuid }
    torrent_id: { type: integer, format: int64, minimum: 1 }
    decision: { type: string, enum: [approve, reject] }
    request_status:
      $ref: "#/PublishedTorrentContentChangeStatus"
    request_version: { type: integer, format: int64, minimum: 2, maximum: 2 }
    torrent_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    decided_at: { type: string, format: date-time }

ScreenshotManifestItem:
  type: object
  additionalProperties: false
  required: [source, index]
  properties:
    source: { type: string, enum: [existing, upload] }
    index: { type: integer, minimum: 0, maximum: 5 }

SubmitPublishedTorrentScreenshotChangeRequest:
  type: object
  additionalProperties: false
  required: [expected_version, manifest, reason]
  properties:
    expected_version:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    manifest:
      type: array
      maxItems: 6
      items:
        $ref: "#/ScreenshotManifestItem"
    uploads:
      type: array
      maxItems: 6
      items:
        type: string
        format: binary
        minLength: 1
        maxLength: 2097152
    reason: { type: string, minLength: 10, maxLength: 1000 }

PublishedTorrentScreenshotChangeStatus:
  type: string
  enum: [pending, approved, rejected]

PublishedTorrentScreenshotChange:
  type: object
  additionalProperties: false
  required: [id, torrent_id, base_torrent_version, base_set_version, base_count, candidate_count, reason, status, version, created_at]
  properties:
    id: { type: string, format: uuid }
    torrent_id: { type: integer, format: int64, minimum: 1 }
    base_torrent_version: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    base_set_version: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
    base_count: { type: integer, minimum: 0, maximum: 6 }
    candidate_count: { type: integer, minimum: 0, maximum: 6 }
    reason: { type: string, minLength: 10, maxLength: 1000 }
    status:
      $ref: "#/PublishedTorrentScreenshotChangeStatus"
    version: { type: integer, format: int64, minimum: 1, maximum: 2 }
    created_at: { type: string, format: date-time }
    decided_at: { type: string, format: date-time, nullable: true }

ManagedPublishedTorrentScreenshotChange:
  type: object
  additionalProperties: false
  required: [change, uploader_numeric_id, uploader_username, uploader_display_name, torrent_title]
  properties:
    change:
      $ref: "#/PublishedTorrentScreenshotChange"
    uploader_numeric_id: { type: integer, format: int64, minimum: 1 }
    uploader_username: { type: string, minLength: 1, maxLength: 64 }
    uploader_display_name: { type: string, minLength: 1, maxLength: 80 }
    torrent_title: { type: string, minLength: 1, maxLength: 240 }

ManagedPublishedTorrentScreenshotChangePage:
  type: object
  additionalProperties: false
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      maxItems: 50
      items:
        $ref: "#/ManagedPublishedTorrentScreenshotChange"
    total: { type: integer, format: int64, minimum: 0 }
    limit: { type: integer, minimum: 1, maximum: 50 }
    offset: { type: integer, minimum: 0, maximum: 1000000 }

DecidePublishedTorrentScreenshotChangeRequest:
  type: object
  additionalProperties: false
  required: [expected_request_version, decision, reason]
