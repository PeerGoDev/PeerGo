      $ref: "#/ManagedTorrentPurchaseStatus"
    price:
      type: string
      pattern: "^(0|[1-9][0-9]{0,6})$"
    tax:
      type: string
      pattern: "^(0|[1-9][0-9]{0,6})$"
    seller_income:
      type: string
      pattern: "^(0|[1-9][0-9]{0,6})$"
    purchased_at:
      type: string
      format: date-time
    refunded_at:
      type: string
      format: date-time
      nullable: true
    refund_reason:
      type: string
      maxLength: 1000
    refunded_by_numeric_id:
      type: integer
      format: int64
      minimum: 1
      nullable: true
    refunded_by_username:
      type: string
      maxLength: 64
    refunded_balance_after:
      type: string
      pattern: "^-?(0|[1-9][0-9]{0,17})$"
      nullable: true

