EmailSettingsOverview:
  type: object
  additionalProperties: false
  required:
    [
      generated_at,
      delivery_mode,
      verification_public_origin,
      password_recovery_public_origin,
      verification_ttl_seconds,
      password_recovery_ttl_seconds,
      cooldown_seconds,
      templates,
      stats,
    ]
  properties:
    generated_at: { type: string, format: date-time }
    delivery_mode:
      type: string
      enum: [development_outbox, https_relay]
