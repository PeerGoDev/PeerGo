OperationsCount:
  type: string
  pattern: "^(0|[1-9][0-9]{0,18})$"

TrackerControlStatus:
  type: object
  additionalProperties: false
  required:
    [
      last_sequence,
      pending_events,
      retrying_events,
      enabled_torrents,
      disabled_torrents,
      oldest_pending_at,
      updated_at,
    ]
  properties:
    last_sequence: { $ref: "#/OperationsCount" }
    pending_events: { $ref: "#/OperationsCount" }
    retrying_events: { $ref: "#/OperationsCount" }
    enabled_torrents: { $ref: "#/OperationsCount" }
    disabled_torrents: { $ref: "#/OperationsCount" }
    oldest_pending_at: { type: string, format: date-time, nullable: true }
    updated_at: { type: string, format: date-time, nullable: true }

SwarmProjectionStatus:
  type: object
  additionalProperties: false
  required:
    [
      source_id,
      routing_epoch,
      snapshot_sequence,
      observed_at,
      applied_at,
      collecting_runs,
      latest_run_progress,
    ]
  properties:
    source_id: { type: string, maxLength: 63 }
    routing_epoch: { $ref: "#/OperationsCount" }
    snapshot_sequence: { $ref: "#/OperationsCount" }
    observed_at: { type: string, format: date-time, nullable: true }
    applied_at: { type: string, format: date-time, nullable: true }
    collecting_runs: { $ref: "#/OperationsCount" }
    latest_run_progress: { type: string, maxLength: 32 }

EvidenceWindowStatus:
  type: object
  additionalProperties: false
  required:
    [
      collecting_windows,
      complete_windows,
      latest_window_start,
      latest_window_end,
      latest_status,
      latest_item_count,
      latest_chunks,
      latest_received,
      month_starts_at,
      coverage_starts_at,
      expected_through,
      expected_windows,
      missing_windows,
      oldest_incomplete,
      health,
    ]
  properties:
    collecting_windows: { $ref: "#/OperationsCount" }
    complete_windows: { $ref: "#/OperationsCount" }
    latest_window_start: { type: string, format: date-time, nullable: true }
    latest_window_end: { type: string, format: date-time, nullable: true }
    latest_status: { type: string, enum: ["", collecting, complete] }
    latest_item_count: { $ref: "#/OperationsCount" }
    latest_chunks: { type: integer, minimum: 0 }
    latest_received: { type: integer, minimum: 0 }
    month_starts_at: { type: string, format: date-time }
    coverage_starts_at: { type: string, format: date-time }
    expected_through: { type: string, format: date-time }
    expected_windows: { $ref: "#/OperationsCount" }
    missing_windows: { $ref: "#/OperationsCount" }
    oldest_incomplete: { type: string, format: date-time, nullable: true }
    health: { type: string, enum: [healthy, lagging, broken, unavailable] }

ConsumerProjectionStatus:
  type: object
  additionalProperties: false
  required: [traffic_entries, traffic_applied_at, hnr_events, hnr_applied_at]
  properties:
    traffic_entries: { $ref: "#/OperationsCount" }
    traffic_applied_at: { type: string, format: date-time, nullable: true }
    hnr_events: { $ref: "#/OperationsCount" }
    hnr_applied_at: { type: string, format: date-time, nullable: true }

TrackerOperationsOverview:
  type: object
  additionalProperties: false
  required: [generated_at, control, swarm, evidence, consumers]
  properties:
    generated_at: { type: string, format: date-time }
    control: { $ref: "#/TrackerControlStatus" }
    swarm: { $ref: "#/SwarmProjectionStatus" }
    evidence: { $ref: "#/EvidenceWindowStatus" }
    consumers: { $ref: "#/ConsumerProjectionStatus" }

TrackerSettingsOverview:
  type: object
  additionalProperties: false
  required: [generated_at, configured, effective, activation_pending, capacity]
  properties:
    generated_at: { type: string, format: date-time }
    configured: { $ref: "#/TrackerPolicyRevision" }
    effective: { $ref: "#/TrackerEffectivePolicy" }
    activation_pending: { type: boolean }
    capacity: { $ref: "#/TrackerCapacitySettings" }

TrackerClientRule:
  type: object
  additionalProperties: false
  required: [family, min_version]
  properties:
    family:
      type: string
      enum: [qbittorrent, transmission, deluge, libtorrent, utorrent]
    min_version:
      type: string
      pattern: "^$|^([0-9]|[0-2][0-9]|3[0-5])(\\.([0-9]|[0-2][0-9]|3[0-5])){1,3}$"

TrackerSeedboxRule:
  type: object
  additionalProperties: false
  required: [id, cidr]
  properties:
    id:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
    cidr:
      type: string
      minLength: 3
      maxLength: 64
    user_numeric_id:
      type: integer
      format: int64
      minimum: 1
      description: 为空时是全站可信网段；有值时仅绑定该用户数字 ID。

TrackerSeedboxRuntimePolicy:
  type: object
  additionalProperties: false
  required:
    [
      enabled,
      upload_factor_basis_points,
      download_factor_basis_points,
      seedbox_speed_limit_bytes_per_second,
      standard_speed_limit_bytes_per_second,
      rules,
    ]
  properties:
    enabled: { type: boolean }
    upload_factor_basis_points: { type: integer, minimum: 0, maximum: 10000 }
    download_factor_basis_points:
      { type: integer, minimum: 10000, maximum: 100000 }
    seedbox_speed_limit_bytes_per_second:
      { type: integer, format: int64, minimum: 0 }
    standard_speed_limit_bytes_per_second:
      { type: integer, format: int64, minimum: 0 }
    rules:
      type: array
      maxItems: 4096
      items: { $ref: "#/TrackerSeedboxRule" }

TrackerPolicySettings:
  type: object
  additionalProperties: false
  required:
    [
      announce_interval_seconds,
      min_announce_interval_seconds,
      default_numwant,
      max_numwant,
      scrape_enabled,
      max_scrape_hashes,
      client_mode,
      allowed_clients,
      user_requests_per_minute,
      user_burst,
      address_requests_per_minute,
      address_burst,
      seedbox,
    ]
  properties:
    announce_interval_seconds:
      { type: integer, format: int64, minimum: 60, maximum: 86400 }
    min_announce_interval_seconds:
      { type: integer, format: int64, minimum: 30, maximum: 86400 }
    default_numwant: { type: integer, format: int64, minimum: 0, maximum: 500 }
    max_numwant: { type: integer, format: int64, minimum: 1, maximum: 500 }
    scrape_enabled: { type: boolean }
    max_scrape_hashes:
      { type: integer, format: int64, minimum: 1, maximum: 100 }
    client_mode: { type: string, enum: [allow_all, allow_list] }
    allowed_clients:
      type: array
      maxItems: 16
      items: { $ref: "#/TrackerClientRule" }
    user_requests_per_minute:
      { type: integer, format: int64, minimum: 1, maximum: 600 }
    user_burst: { type: integer, format: int64, minimum: 1, maximum: 1200 }
    address_requests_per_minute:
      { type: integer, format: int64, minimum: 1, maximum: 5000 }
    address_burst: { type: integer, format: int64, minimum: 1, maximum: 10000 }
    seedbox: { $ref: "#/TrackerSeedboxRuntimePolicy" }

TrackerPolicyRevision:
  type: object
  additionalProperties: false
  required: [sequence, revision, settings, reason, created_at]
  properties:
    sequence: { $ref: "#/OperationsCount" }
    revision: { type: string, maxLength: 64 }
    settings: { $ref: "#/TrackerPolicySettings" }
    reason: { type: string, minLength: 5, maxLength: 1000 }
    created_at: { type: string, format: date-time }
    issued_by: { type: string, format: uuid, nullable: true }

TrackerEffectivePolicy:
  type: object
  additionalProperties: false
  required: [sequence, revision, generated_at, settings]
  properties:
    sequence: { $ref: "#/OperationsCount" }
    revision: { type: string, maxLength: 64 }
    generated_at: { type: string, format: date-time }
    settings: { $ref: "#/TrackerPolicySettings" }

TrackerCapacitySettings:
  type: object
  additionalProperties: false
  required: [peer_ttl_seconds, max_swarms, max_peers, max_peers_per_swarm]
  properties:
    peer_ttl_seconds:
      { type: integer, format: int64, minimum: 61, maximum: 86400 }
    max_swarms: { $ref: "#/OperationsCount" }
    max_peers: { $ref: "#/OperationsCount" }
    max_peers_per_swarm: { $ref: "#/OperationsCount" }

IssueTrackerPolicyRequest:
  type: object
  additionalProperties: false
  required: [expected_sequence, settings, reason]
  properties:
    expected_sequence: { $ref: "#/OperationsCount" }
    settings: { $ref: "#/TrackerPolicySettings" }
    reason: { type: string, minLength: 5, maxLength: 1000 }

TorrentUploadRules:
  type: object
  additionalProperties: false
  required:
    [
      metainfo_max_bytes,
      max_files,
      required_private,
      supported_protocol,
      duplicate_swarm_rejected,
      initial_state,
    ]
  properties:
    metainfo_max_bytes: { $ref: "#/OperationsCount" }
    max_files: { type: integer, minimum: 1, maximum: 100000 }
    required_private: { type: boolean }
    supported_protocol: { type: string, enum: [bittorrent-v1] }
    duplicate_swarm_rejected: { type: boolean }
    initial_state: { type: string, enum: [pending_review] }

TorrentScreenshotRules:
  type: object
  additionalProperties: false
  required: [max_count, max_bytes_per_file, formats, first_is_cover]
  properties:
    max_count: { type: integer, minimum: 0, maximum: 20 }
    max_bytes_per_file: { $ref: "#/OperationsCount" }
    formats:
      type: array
      minItems: 3
      maxItems: 3
      uniqueItems: true
      items: { type: string, enum: [jpeg, png, webp] }
    first_is_cover: { type: boolean }

TorrentObjectRules:
  type: object
  additionalProperties: false
  required:
    [
      original_stored_immutable,
      announce_rewritten_on_download,
      legacy_import_profile,
      new_upload_profile,
    ]
  properties:
    original_stored_immutable: { type: boolean }
    announce_rewritten_on_download: { type: boolean }
    legacy_import_profile: { type: string, enum: [legacy_import] }
    new_upload_profile: { type: string, enum: [strict_upload] }

TorrentPurchaseRules:
  type: object
  additionalProperties: false
  required:
    [
      enabled,
      currency_name,
      whole_units_only,
      tax_basis_points,
      policy_revision,
      policy_effective_from,
      priced_torrents,
      legacy_entitlements,
      live_entitlements,
      permanent_access,
      atomic_settlement,
      refund_connected,
    ]
  properties:
    enabled: { type: boolean }
    currency_name: { type: string, minLength: 1, maxLength: 32 }
    whole_units_only: { type: boolean }
    tax_basis_points:
      { type: integer, format: int64, minimum: 0, maximum: 10000 }
    policy_revision: { type: string, maxLength: 64 }
    policy_effective_from: { type: string, format: date-time, nullable: true }
    priced_torrents: { $ref: "#/OperationsCount" }
    legacy_entitlements: { $ref: "#/OperationsCount" }
    live_entitlements: { $ref: "#/OperationsCount" }
    permanent_access: { type: boolean }
    atomic_settlement: { type: boolean }
    refund_connected: { type: boolean }

TorrentSettingsOverview:
  type: object
  additionalProperties: false
  required:
    [
      generated_at,
      upload,
      screenshots,
      object,
      purchase,
      active_upload_policy,
      scheduled_upload_policies,
    ]
  properties:
    generated_at: { type: string, format: date-time }
    upload: { $ref: "#/TorrentUploadRules" }
    screenshots: { $ref: "#/TorrentScreenshotRules" }
    object: { $ref: "#/TorrentObjectRules" }
    purchase: { $ref: "#/TorrentPurchaseRules" }
    active_upload_policy: { $ref: "#/TorrentUploadPolicyRevision" }
    scheduled_upload_policies:
      type: array
      maxItems: 20
      items: { $ref: "#/TorrentUploadPolicyRevision" }

TorrentUploadPolicySettings:
  type: object
  additionalProperties: false
  required:
    [
      metainfo_max_bytes,
      max_files,
      screenshot_max_count,
      screenshot_max_bytes,
      screenshot_max_pixels,
      screenshot_formats,
    ]
  properties:
    metainfo_max_bytes: { type: integer, minimum: 65536, maximum: 16777216 }
    max_files: { type: integer, minimum: 1, maximum: 100000 }
    screenshot_max_count: { type: integer, minimum: 0, maximum: 6 }
    screenshot_max_bytes: { type: integer, minimum: 65536, maximum: 2097152 }
    screenshot_max_pixels: { type: integer, minimum: 65536, maximum: 25000000 }
    screenshot_formats:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      items: { type: string, enum: [jpeg, png, webp] }

TorrentUploadPolicyRevision:
  type: object
  additionalProperties: false
  required: [id, sequence, effective_at, settings, reason, created_at]
  properties:
    id: { type: string, format: uuid }
    sequence:
      { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    effective_at: { type: string, format: date-time }
    settings: { $ref: "#/TorrentUploadPolicySettings" }
    reason: { type: string, minLength: 10, maxLength: 1000 }
    created_at: { type: string, format: date-time }

IssueTorrentUploadPolicyRequest:
  type: object
  additionalProperties: false
  required: [expected_sequence, effective_at, settings, reason]
  properties:
    expected_sequence:
      { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
    effective_at: { type: string, format: date-time }
    settings: { $ref: "#/TorrentUploadPolicySettings" }
    reason: { type: string, minLength: 10, maxLength: 1000 }

HNRPolicySettings:
  type: object
  additionalProperties: false
  required:
    [
      configured,
      revision_id,
      effective_at,
      rule_id,
      rule_version,
      mode,
      required_seed_seconds,
      required_ratio_basis_points,
      assessment_window_seconds,
      grace_period_seconds,
      max_interval_credit_seconds,
    ]
  properties:
    configured: { type: boolean }
    revision_id: { type: string, maxLength: 64 }
    effective_at: { type: string, format: date-time, nullable: true }
    rule_id: { type: string, maxLength: 128 }
    rule_version: { type: integer, format: int64, minimum: 0 }
    mode: { type: string, enum: ["", disabled, exempt, enforced] }
    required_seed_seconds: { type: integer, format: int64, minimum: 0 }
    required_ratio_basis_points:
      { type: integer, format: int64, minimum: 0, maximum: 1000000 }
    assessment_window_seconds: { type: integer, format: int64, minimum: 0 }
    grace_period_seconds: { type: integer, format: int64, minimum: 0 }
    max_interval_credit_seconds:
      { type: integer, format: int64, minimum: 0, maximum: 86400 }

SeedboxPolicySettings:
  type: object
  additionalProperties: false
  required:
    [
      settlement_primitive_supported,
      global_policy_configured,
      upload_factor_basis_points,
      download_factor_basis_points,
      classification_connected,
      registry_connected,
      speed_observation_connected,
    ]
  properties:
    settlement_primitive_supported: { type: boolean }
    global_policy_configured: { type: boolean }
    upload_factor_basis_points:
      { type: integer, format: int64, minimum: 0, maximum: 10000 }
    download_factor_basis_points:
      { type: integer, format: int64, minimum: 10000, maximum: 100000 }
    classification_connected: { type: boolean }
    registry_connected: { type: boolean }
    speed_observation_connected: { type: boolean }

SettlementSettingsOverview:
  type: object
  additionalProperties: false
  required: [generated_at, hnr, seedbox, global_ratio_watch_connected]
  properties:
    generated_at: { type: string, format: date-time }
    hnr: { $ref: "#/HNRPolicySettings" }
    seedbox: { $ref: "#/SeedboxPolicySettings" }
    global_ratio_watch_connected: { type: boolean }

ActivityRewardReadiness:
  type: object
  additionalProperties: false
  required:
    [
      ledger_supported,
      daily_attendance_connected,
      random_attendance_connected,
      streak_reward_connected,
      retroactive_connected,
      torrent_publish_connected,
      invite_reward_connected,
    ]
  properties:
    ledger_supported: { type: boolean }
    daily_attendance_connected: { type: boolean }
    random_attendance_connected: { type: boolean }
    streak_reward_connected: { type: boolean }
    retroactive_connected: { type: boolean }
    torrent_publish_connected: { type: boolean }
    invite_reward_connected: { type: boolean }

MagicUsageRules:
  type: object
  additionalProperties: false
  required:
    [
      currency_name,
      whole_units_only,
      pt_coin_enabled,
      member_overdraft_allowed,
      append_only_ledger,
      torrent_purchase_supported,
      torrent_purchase_connected,
      member_gift_connected,
      content_tip_connected,
      refund_supported,
    ]
  properties:
    currency_name: { type: string, minLength: 1, maxLength: 32 }
    whole_units_only: { type: boolean }
    pt_coin_enabled: { type: boolean }
    member_overdraft_allowed: { type: boolean }
    append_only_ledger: { type: boolean }
    torrent_purchase_supported: { type: boolean }
    torrent_purchase_connected: { type: boolean }
    member_gift_connected: { type: boolean }
    content_tip_connected: { type: boolean }
    refund_supported: { type: boolean }

EconomyTransactionCounts:
  type: object
  additionalProperties: false
  required:
    [
      legacy_opening,
      seeding_reward,
      harem_reward,
      activity_reward,
      torrent_purchase,
      member_gift,
      tip,
      refund,
      adjustment,
    ]
  properties:
    legacy_opening: { $ref: "#/OperationsCount" }
    seeding_reward: { $ref: "#/OperationsCount" }
    harem_reward: { $ref: "#/OperationsCount" }
    activity_reward: { $ref: "#/OperationsCount" }
    torrent_purchase: { $ref: "#/OperationsCount" }
    member_gift: { $ref: "#/OperationsCount" }
    tip: { $ref: "#/OperationsCount" }
    refund: { $ref: "#/OperationsCount" }
    adjustment: { $ref: "#/OperationsCount" }

EconomySettingsOverview:
  type: object
  additionalProperties: false
  required: [generated_at, activity, usage, transactions]
  properties:
    generated_at: { type: string, format: date-time }
    activity: { $ref: "#/ActivityRewardReadiness" }
    usage: { $ref: "#/MagicUsageRules" }
    transactions: { $ref: "#/EconomyTransactionCounts" }

WorkerQueueStatus:
  type: object
  additionalProperties: false
  required:
    [
      id,
      label,
      pending,
      processing,
      retrying,
      dead,
      completed,
      oldest_pending_at,
      last_error_code,
      last_error_at,
    ]
  properties:
    id:
      type: string
      enum:
        [
          seeding_reward,
          promotion_delivery,
          hnr_policy_delivery,
          entitlement_benefit_delivery,
          hnr_enforcement,
          tracker_control,
          audit_delivery,
        ]
    label: { type: string, maxLength: 32 }
    pending: { $ref: "#/OperationsCount" }
    processing: { $ref: "#/OperationsCount" }
    retrying: { $ref: "#/OperationsCount" }
    dead: { $ref: "#/OperationsCount" }
    completed: { $ref: "#/OperationsCount" }
    oldest_pending_at: { type: string, format: date-time, nullable: true }
    last_error_code: { type: string, maxLength: 64 }
    last_error_at: { type: string, format: date-time, nullable: true }

WorkerOperationsOverview:
  type: object
  additionalProperties: false
  required: [generated_at, queues]
  properties:
    generated_at: { type: string, format: date-time }
    queues:
      type: array
      minItems: 5
      maxItems: 5
      items: { $ref: "#/WorkerQueueStatus" }

StorageRuntime:
  type: object
  additionalProperties: false
  required:
    [
      backend_id,
      driver,
      torrent_upload_max_bytes,
      screenshot_max_bytes,
      avatar_max_bytes,
    ]
  properties:
    backend_id:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
    driver:
      type: string
      enum: [filesystem, s3]
    torrent_upload_max_bytes: { $ref: "#/OperationsCount" }
    screenshot_max_bytes: { $ref: "#/OperationsCount" }
    avatar_max_bytes: { $ref: "#/OperationsCount" }

StorageInventory:
  type: object
  additionalProperties: false
  required:
    [
      torrent_objects,
      torrent_bytes,
      screenshot_objects,
      screenshot_bytes,
      avatar_objects,
      avatar_bytes,
      preferred_on_active_backend,
      verified_on_other_backends,
      active_migrations,
      failed_migration_items,
    ]
  properties:
    torrent_objects: { $ref: "#/OperationsCount" }
    torrent_bytes: { $ref: "#/OperationsCount" }
    screenshot_objects: { $ref: "#/OperationsCount" }
    screenshot_bytes: { $ref: "#/OperationsCount" }
    avatar_objects: { $ref: "#/OperationsCount" }
    avatar_bytes: { $ref: "#/OperationsCount" }
    preferred_on_active_backend: { $ref: "#/OperationsCount" }
    verified_on_other_backends: { $ref: "#/OperationsCount" }
    active_migrations: { $ref: "#/OperationsCount" }
    failed_migration_items: { $ref: "#/OperationsCount" }

ImageDerivativeOverview:
  type: object
  additionalProperties: false
  required:
    [
      policy_version,
      pending,
      processing,
      retrying,
      ready,
      dead,
      source_objects,
      output_objects,
      output_bytes,
      last_error_code,
    ]
  properties:
    policy_version:
      type: string
      minLength: 1
      maxLength: 32
    pending: { $ref: "#/OperationsCount" }
    processing: { $ref: "#/OperationsCount" }
    retrying: { $ref: "#/OperationsCount" }
    ready: { $ref: "#/OperationsCount" }
    dead: { $ref: "#/OperationsCount" }
    source_objects: { $ref: "#/OperationsCount" }
    output_objects: { $ref: "#/OperationsCount" }
    output_bytes: { $ref: "#/OperationsCount" }
    oldest_pending_at:
      type: string
      format: date-time
      nullable: true
    last_error_code:
      type: string
      maxLength: 64
    last_error_at:
      type: string
      format: date-time
      nullable: true

StorageMigrationOverview:
  type: object
  additionalProperties: false
  required:
    [
      id,
      mode,
      status,
      object_kinds,
      source_backend_id,
      destination_backend_id,
      total_items,
      pending_items,
      verified_items,
      failed_items,
      deleted_items,
      last_error_code,
      created_at,
    ]
  properties:
    id: { type: string, format: uuid }
    mode:
      type: string
      enum: [replicate, move]
    status:
      type: string
      enum:
        [copying, ready_for_cutover, retaining, cleaning, completed, cancelled]
    object_kinds:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        type: string
        enum: [torrent, torrent_screenshot, avatar, image_derivative]
    source_backend_id: { type: string, minLength: 1, maxLength: 63 }
    destination_backend_id: { type: string, minLength: 1, maxLength: 63 }
    total_items: { $ref: "#/OperationsCount" }
    pending_items: { $ref: "#/OperationsCount" }
    verified_items: { $ref: "#/OperationsCount" }
    failed_items: { $ref: "#/OperationsCount" }
    deleted_items: { $ref: "#/OperationsCount" }
    last_error_code: { type: string, maxLength: 64 }
    created_at: { type: string, format: date-time }
    cutover_at: { type: string, format: date-time, nullable: true }
    retention_until: { type: string, format: date-time, nullable: true }
