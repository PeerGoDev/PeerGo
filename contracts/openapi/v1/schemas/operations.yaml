    password_recovery_public_origin:
      { type: string, format: uri, maxLength: 2048 }
    verification_ttl_seconds:
      { type: integer, format: int64, minimum: 1, maximum: 86400 }
    password_recovery_ttl_seconds:
      { type: integer, format: int64, minimum: 1, maximum: 86400 }
    cooldown_seconds:
      { type: integer, format: int64, minimum: 1, maximum: 86400 }
    templates:
      type: array
      minItems: 2
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        enum: [peergo-email-verification-v1, peergo-password-recovery-v1]
