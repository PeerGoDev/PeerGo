    - free_price_per_day
    - double_upload_price_per_day
    - double_upload_free_price_per_day
    - half_download_price_per_day
    - double_upload_half_download_price_per_day
    - thirty_percent_download_price_per_day
    - sticky_price_per_day
    - max_promotion_days
    - max_sticky_days
    - reason
  properties:
    expected_revision:
      type: string
      pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
    promotion_enabled:
      type: boolean
    sticky_enabled:
      type: boolean
    free_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    double_upload_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    double_upload_free_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    half_download_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    double_upload_half_download_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    thirty_percent_download_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    sticky_price_per_day:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000
    max_promotion_days:
      type: integer
      minimum: 1
      maximum: 30
    max_sticky_days:
      type: integer
      minimum: 1
      maximum: 30
    reason:
      type: string
      minLength: 10
      maxLength: 1000
