ChallengeIDParameter:
  name: challenge_id
  in: path
  required: true
  schema:
    type: string
    format: uuid

MyMagicShopPath:
  get:
    operationId: getMyMagicShop
    summary: 查看魔力商店、限购进度和自己的道具
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicshop.read.self
    x-credential-audience: web-session
    responses:
      "200":
        description: 当前商店配置、余额、VIP、彩色 ID、补签卡与最近订单。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MagicShopOverview"
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyMagicShopOrdersPath:
  post:
    operationId: purchaseMagicShopItem
    summary: 用魔力值购买商店道具
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicshop.purchase.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/PurchaseMagicShopItemRequest"
    responses:
      "201":
        description: 扣款、道具效果和订单回执已原子提交；重放返回同一订单。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MagicShopPurchaseReceipt"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyNameStylePath:
  put:
    operationId: setMyNameStyle
    summary: 在已购买的档位内切换彩色 ID 样式
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicshop.purchase.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/SetNameStyleRequest"
    responses:
      "200":
        description: 新样式已生效，到期时间不变。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MemberNameStyle"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

NameStylesPath:
  get:
    operationId: listNameStyles
    summary: 列出全站仍在有效期内的彩色 ID
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.namestyle.read
    x-credential-audience: web-session
    responses:
      "200":
        description: 用户名与样式键；前端据此渲染彩色用户名。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MemberNameStyleList"
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyAttendanceMakeupPath:
  post:
    operationId: makeupMyAttendance
    summary: 使用补签卡补回最近一次签到后的漏签日
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.attendance.claim.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    responses:
      "201":
        description: 补签记录、奖励账本和补签卡消耗已原子提交。
        content:
          application/json:
            schema:
              $ref: "../schemas/economy.yaml#/AttendanceRecord"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyMagicGamesPath:
  get:
    operationId: getMyMagicGames
    summary: 查看刮刮乐、每日彩票和擂台
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.read.self
    x-credential-audience: web-session
    responses:
      "200":
        description: 游戏配置、当前与上一期彩票、开放擂台和自己的游戏记录。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MagicGamesOverview"
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyScratchCardsPath:
  post:
    operationId: playScratchCard
    summary: 买一张刮刮乐并立即开奖
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.play.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    responses:
      "201":
        description: 购票和派奖账本已提交；重放返回同一张卡。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/ScratchCardReceipt"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyLotteryTicketsPath:
  post:
    operationId: buyLotteryTickets
    summary: 购买本期每日彩票
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.play.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/BuyLotteryTicketsRequest"
    responses:
      "201":
        description: 彩票号码段与奖池入账已提交。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/LotteryTicketReceipt"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyPvPChallengesPath:
  post:
    operationId: createPvPChallenge
    summary: 押上魔力值发起擂台
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.play.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/CreatePvPChallengeRequest"
    responses:
      "201":
        description: 赌注已托管，擂台开放到过期时间。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/PvPChallenge"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyPvPChallengeAcceptPath:
  parameters:
    - $ref: "#/ChallengeIDParameter"
  post:
    operationId: acceptPvPChallenge
    summary: 应战并立即结算擂台
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.play.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/AcceptPvPChallengeRequest"
    responses:
      "200":
        description: 擂台已结算；平局双方退回赌注。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/PvPChallenge"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyPvPChallengeCancelPath:
  parameters:
    - $ref: "#/ChallengeIDParameter"
  post:
    operationId: cancelPvPChallenge
    summary: 撤回自己仍开放的擂台并退回赌注
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.magicgame.play.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
    responses:
      "200":
        description: 擂台已撤回，赌注已退回。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/PvPChallenge"
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MagicStoreSettingsPath:
  get:
    operationId: getMagicStoreSettings
    summary: 读取魔力商店与游戏配置、资金账户和修订历史
    tags: [economy]
    x-audience: [staff]
    x-owner: core-economy
    x-permission: economy.magicstore.manage.read
    x-credential-audience: staff-session
    responses:
      "200":
        description: 当前配置版本与系统账户余额。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MagicStoreAdminOverview"
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }
  put:
    operationId: updateMagicStoreSettings
    summary: 修改魔力商店价格、限购和游戏赔率
    tags: [economy]
    x-audience: [staff]
    x-owner: core-economy
    x-permission: economy.magicstore.update
    x-credential-audience: staff-session
    parameters:
      - $ref: "../domains/authz.yaml#/StaffCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/magicstore.yaml#/UpdateMagicStoreSettingsRequest"
    responses:
      "200":
        description: 新配置已生效并追加不可变修订。
        content:
          application/json:
            schema:
              $ref: "../schemas/magicstore.yaml#/MagicStoreAdminOverview"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }
