          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AccountAccessAppeal"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      "429": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

AccountAccessStatusPath:
  post:
    operationId: inspectAccountAccess
    summary: 使用本人凭据查询当前账户访问限制与既有申诉
    description: >-
      该端点不会创建会话；凭据仅用于本次 Vault 校验，禁止写入日志、缓存或数据库。
      即使账户已被禁用，正确凭据仍可查看限制原因和申诉处理结果。
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: user.account.appeal.create.restricted
    x-credential-audience: anonymous
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/InspectAccountAccessRequest"
    responses:
      "200":
        description: 本人当前的账户访问状态。
        headers:
          Cache-Control:
            description: 凭据校验结果不得进入浏览器或代理缓存。
            required: true
            schema: { type: string, enum: [no-store] }
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AccountAccessStatus"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "428": { $ref: "../responses.yaml#/ProblemResponse" }
      "429": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

AccountAccessAppealsPath:
  post:
    operationId: submitAccountAccessAppeal
    summary: 使用本人凭据为当前账户访问限制提交一次申诉
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: user.account.appeal.create.restricted
    x-credential-audience: anonymous
    parameters:
      - $ref: "#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/SubmitAccountAccessAppealRequest"
    responses:
      "201":
        description: 申诉已提交；相同幂等键和内容重试时返回原记录。
        headers:
          Cache-Control:
            description: 本人申诉内容不得进入浏览器或代理缓存。
            required: true
            schema: { type: string, enum: [no-store] }
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AccountAccessAppeal"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      "428": { $ref: "../responses.yaml#/ProblemResponse" }
      "429": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

ManagedAccountAccessAppealsPath:
  get:
    operationId: listManagedAccountAccessAppeals
    summary: 在用户管理中查看账户访问与旧站或人工下载限制申诉队列
    tags: [identity]
    x-audience: [staff]
    x-owner: core-identity
    x-permission: user.account.appeal.read
    x-credential-audience: staff-session
    parameters:
      - name: query
        in: query
        schema: { type: string, maxLength: 120 }
      - name: status
        in: query
        schema: { $ref: "../schemas/identity.yaml#/AccountAccessAppealFilter" }
      - name: limit
        in: query
        required: true
        schema: { type: integer, minimum: 1, maximum: 50 }
      - name: offset
        in: query
        required: true
        schema: { type: integer, minimum: 0, maximum: 1000000 }
    responses:
      "200":
        description: 待处理优先的账户访问与下载限制申诉分页。
        headers:
          Cache-Control:
            description: 后台用户申诉数据不得进入共享缓存。
            required: true
            schema: { type: string, enum: [no-store] }
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AccountAccessAppealPage"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "429": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

ManagedAccountAccessAppealDecisionPath:
  post:
    operationId: decideManagedAccountAccessAppeal
    summary: 只批准解除申诉绑定的账户或下载限制来源，或驳回并保持原限制
    tags: [identity]
    x-audience: [staff]
    x-owner: core-identity
    x-permission: user.account.appeal.decide
    x-credential-audience: staff-session
    parameters:
      - name: appeal_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "../domains/authz.yaml#/StaffCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/DecideAccountAccessAppealRequest"
    responses:
      "200":
        description: 处理意见已固化；批准时只解除申诉快照对应的限制来源。
        headers:
          Cache-Control:
            description: 后台处置结果不得进入共享缓存。
            required: true
            schema: { type: string, enum: [no-store] }
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AccountAccessAppeal"
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      "429": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

WebCSRFHeader:
  name: X-CSRF-Token
  in: header
  required: true
  description: 与当前普通 Web 会话绑定的 CSRF token。
  schema:
    type: string
    minLength: 43
    maxLength: 43

IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  required: true
  description: 浏览器为本次敏感变更生成并在安全重试时复用的 UUID。
  schema:
    type: string
    format: uuid
