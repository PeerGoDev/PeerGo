RegistrationsPath:
  post:
    operationId: createRegistration
    summary: 按当前站点准入策略创建普通账户，并保留开放注册中的可选邀请关系
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.register.anonymous
    x-credential-audience: anonymous
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 浏览器为一次注册尝试生成并在安全重试时复用的 UUID。
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/CreateRegistrationRequest"
    responses:
      "201":
        description: >-
          账户与凭据已完成跨存储激活。邮箱仍待验证，首版应先使用用户名登录。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/RegistrationResult"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

MyInvitationsPath:
  get:
    operationId: getMyInvitations
    summary: 查看自己的邀请资格、名额与邀请记录
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: invitation.read.self
    x-credential-audience: web-session
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 99999
          default: 0
    responses:
      "200":
        description: 邀请资格与不含任何邀请码明文的历史记录。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/InvitationOverview"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  post:
    operationId: issueMyInvitation
    summary: 为指定邮箱签发一个自己的单次注册邀请码
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: invitation.issue.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/IssueInvitationRequest"
    responses:
      "201":
        description: 邀请码已签发；明文 token 仅在本响应返回一次。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/InvitationIssueResult"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

MyInvitationRevocationPath:
  parameters:
    - name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: revokeMyInvitation
    summary: 撤销一个自己尚未被领取的邀请码
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: invitation.revoke.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/WebCSRFHeader"
    responses:
      "200":
        description: 邀请码已撤销并立即释放名额。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/MemberInvitation"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

EmailVerificationsPath:
  post:
    operationId: requestEmailVerification
    summary: 为当前账户请求邮箱验证邮件
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.email.verify.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/RequestEmailVerificationRequest"
    responses:
      "202":
        description: >-
          请求已按枚举安全语义处理；响应不说明重新输入的地址是否匹配。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/EmailVerificationDispatch"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

EmailVerificationConfirmationPath:
  post:
    operationId: confirmEmailVerification
    summary: 使用一次性 bearer token 确认邮箱所有权
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.email.confirm.anonymous
    x-credential-audience: anonymous
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/ConfirmEmailVerificationRequest"
    responses:
      "200":
        description: Vault identifier 与 Core 用户投影均已完成验证。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/EmailVerificationResult"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

PasswordRecoveryRequestsPath:
  post:
    operationId: requestPasswordRecovery
    summary: 使用注册邮箱请求一次性密码恢复链接
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.password.recovery.request.anonymous
    x-credential-audience: anonymous
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/RequestPasswordRecoveryRequest"
    responses:
      "202":
        description: >-
          请求已按枚举安全语义处理；响应不说明邮箱是否命中已验证账户。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/PasswordRecoveryDispatch"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

PasswordRecoveryConfirmationPath:
  post:
    operationId: confirmPasswordRecovery
    summary: 使用一次性密码恢复凭证设置新密码
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.password.recovery.confirm.anonymous
    x-credential-audience: anonymous
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/ConfirmPasswordRecoveryRequest"
    responses:
      "200":
        description: >-
          Vault 密码已替换，Core 已撤销该账户的全部 Web 与 staff 会话。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/PasswordRecoveryResult"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

SessionPath:
  get:
    operationId: getWebSession
    summary: 获取当前 Web 会话
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: session.read.self
    x-credential-audience: web-session
    responses:
      "200":
        description: 当前有效 Web 会话。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/WebSession"
      "204":
        description: 当前没有有效会话。
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

  post:
    operationId: createWebSession
    summary: 使用站内凭据创建 Web 会话
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: session.create.self
    x-credential-audience: anonymous
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/identity.yaml#/CreateSessionRequest"
    responses:
      "200":
        description: 登录成功；原始会话 token 只通过 HttpOnly cookie 返回。
        headers:
          Set-Cookie:
            description: HttpOnly、SameSite 会话 cookie。
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/WebSession"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "428":
        description: >-
          密码已验证，但该账户需要继续提交 TOTP 或一次性恢复码；此响应不会创建会话。
        content:
          application/problem+json:
            schema:
              $ref: "../schemas/problem.yaml#/Problem"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  delete:
    operationId: deleteWebSession
    summary: 撤销当前 Web 会话
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: session.revoke.self
    x-credential-audience: web-session
    parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: 与当前会话绑定的 CSRF token。
        schema:
          type: string
          minLength: 43
          maxLength: 43
    responses:
      "204":
        description: 会话已撤销或已经不存在。
        headers:
          Set-Cookie:
            description: 立即过期的会话 cookie。
            schema:
              type: string
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

PublicUserProfilePath:
  parameters:
    - name: username
      in: path
      required: true
      description: 成员用户名；大小写不敏感，响应始终返回规范大小写。
      schema:
        type: string
        minLength: 1
        maxLength: 64
  get:
    operationId: getPublicUserProfile
    summary: 获取站内成员的公开资料
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: user.profile.read.member
    x-credential-audience: web-session
    responses:
      "200":
        description: 不包含邮箱、IP、限制状态或私密流量的成员公开资料。
        headers:
          Cache-Control:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/PublicUserProfile"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

AccountProfilePath:
  patch:
    operationId: updateMyProfile
    summary: 修改当前账户的公开资料
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
