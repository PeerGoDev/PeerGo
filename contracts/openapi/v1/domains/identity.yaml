          maxLength: 43
    responses:
      "204":
        description: 其他有效会话及其 staff 子会话均已撤销；当前会话保留。
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
