          schema:
            $ref: "../schemas/identity.yaml#/UpdateMyProfileRequest"
    responses:
      "200":
        description: 已更新的当前会话用户投影。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/SessionUser"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

MyAvatarPath:
  put:
    operationId: updateMyAvatar
    summary: 上传并替换当前账户的公开头像
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: account.profile.update.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
            minLength: 1
            maxLength: 1048576
    responses:
      "200":
        description: 已完成完整回读校验并设为当前头像。
        content:
          application/json:
            schema:
              $ref: "../schemas/identity.yaml#/AvatarRevision"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "413":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

PublicUserAvatarPath:
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  get:
    operationId: getPublicUserAvatar
    summary: 获取站内成员当前公开头像
    tags: [identity]
    x-audience: [web]
    x-owner: core-identity
    x-permission: user.profile.read.member
    x-credential-audience: web-session
    responses:
      "200":
        description: 已完成完整 SHA-256 与长度校验的公开头像。
        headers:
          Cache-Control:
            required: true
            schema:
              type: string
          ETag:
            required: true
            schema:
              type: string
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

AccountSecurityPath:
