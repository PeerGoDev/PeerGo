SocialPostsPath:
  get:
    operationId: listSocialPosts
    summary: 分页读取成员可见的公开动态
    tags: [social]
    x-audience: [web]
    x-owner: core-social
    x-permission: social.post.read
    x-credential-audience: web-session
    parameters:
      - name: sort
        in: query
        required: false
        schema:
          $ref: "../schemas/social.yaml#/SocialPostSort"
        description: 首版只支持按发表时间排序。
      - name: author_username
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: 只读取指定成员仍然可见的动态；省略时读取完整成员动态流。
      - name: feed
        in: query
        required: false
        schema:
          $ref: "../schemas/social.yaml#/SocialFeedKind"
      - name: board_id
        in: query
        required: false
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      - name: featured_only
        in: query
        required: false
        schema: { type: boolean, default: false }
      - name: topic
        in: query
        required: false
        schema: { type: string, minLength: 1, maxLength: 40 }
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 99999
          default: 0
    responses:
      "200":
        description: 动态分页。
        content:
          application/json:
            schema:
              $ref: "../schemas/social.yaml#/SocialPostPage"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  post:
    operationId: createSocialPost
    summary: 向指定板块发布含图片、投票或红包的动态
    tags: [social]
    x-audience: [web]
    x-owner: core-social
    x-permission: social.post.create.self
    x-credential-audience: web-session
    parameters:
      - $ref: "./identity.yaml#/WebCSRFHeader"
      - $ref: "./identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/social.yaml#/CreateSocialPostRequest"
    responses:
      "201":
        description: 动态已发布；相同幂等键与正文重试时返回原动态。
        content:
          application/json:
            schema:
              $ref: "../schemas/social.yaml#/SocialPost"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

