TorrentCommentsPath:
  get:
    operationId: listTorrentComments
    summary: 分页读取已发布种子的公开评论
    tags: [comments]
    x-audience: [web]
    x-owner: core-social
    x-permission: torrent.read
    x-credential-audience: anonymous
    parameters:
      - $ref: "../domains/torrents.yaml#/TorrentIDPathParameter"
      - name: limit
        in: query
        required: false
        description: 单页评论数量上限。
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        required: false
        description: 从零开始的评论偏移量。
        schema:
          type: integer
          minimum: 0
          maximum: 99999
          default: 0
    responses:
      "200":
        description: 按发表时间从早到晚排列的评论与回复；删除项保留墓碑。
        content:
          application/json:
            schema:
              $ref: "../schemas/comments.yaml#/TorrentCommentPage"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  post:
    operationId: createTorrentComment
    summary: 在已发布种子下发表评论或回复同线程可见评论
    tags: [comments]
    x-audience: [web]
    x-owner: core-social
    x-permission: torrent.comment.create.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/torrents.yaml#/TorrentIDPathParameter"
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/comments.yaml#/CreateCommentRequest"
    responses:
      "201":
        description: 评论已创建；相同幂等键和相同内容重试时返回原评论。
        content:
          application/json:
            schema:
              $ref: "../schemas/comments.yaml#/Comment"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

