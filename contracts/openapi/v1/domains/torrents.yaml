TorrentsPath:
  get:
    operationId: listTorrents
    summary: 获取最新种子摘要
    tags: [catalog]
    x-audience: [web]
    x-owner: core-catalog
    x-permission: torrent.read
    x-credential-audience: anonymous
    parameters:
      - name: limit
        in: query
        description: 返回数量上限。
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        description: 对名称和副标题进行不区分大小写的包含匹配。
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: search_scope
        in: query
        description: 关键词匹配范围；省略时同时匹配标题和副标题。
        required: false
        schema:
          type: string
          enum: [title_subtitle, title, subtitle]
          default: title_subtitle
      - name: offset
        in: query
        description: 从匹配结果中跳过的数量，用于稳定分页。
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: category_id
        in: query
        description: 只返回指定启用分类的种子；省略时返回全部分类。
        required: false
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      - name: promotion
        in: query
        description: 只返回当前公开展示优惠匹配的种子；历史结算不读取此字段。
        required: false
        schema:
          type: string
          enum:
            - none
            - free
            - double_upload
            - double_upload_free
            - half_download
            - double_upload_half_download
            - thirty_percent_download
      - name: sort
        in: query
        description: 搜索结果排序；省略时按最新发布时间倒序。
        required: false
        schema:
          type: string
          enum:
            [published_desc, published_asc, size_desc, size_asc, completed_desc]
          default: published_desc
    responses:
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "200":
        description: 最新种子与异步 swarm 统计快照。
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/TorrentList"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  post:
    operationId: submitTorrent
    summary: 提交原始私有 v1 种子进入审核
    tags: [torrents]
    x-audience: [web]
    x-owner: core-torrents
    x-permission: torrent.submit
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../schemas/torrents.yaml#/TorrentSubmissionRequest"
    responses:
      "201":
        description: >-
          原始对象已完整回读校验，种子及文件清单已原子写入待审核状态。
        content:
          application/json:
            schema:
              $ref: "../schemas/torrents.yaml#/TorrentSubmission"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "413":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

MyTorrentSubmissionsPath:
  get:
    operationId: listMyTorrentSubmissions
    summary: 获取当前用户的种子提交状态与最近审核反馈
    tags: [torrents]
    x-audience: [web]
    x-owner: core-torrents
    x-permission: torrent.submission.read.self
    x-credential-audience: web-session
    parameters:
      - name: limit
        in: query
        required: false
        description: 最近提交记录的返回上限。
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    responses:
      "200":
        description: >-
          仅返回本人提交的稳定元数据、生命周期状态和最近审核反馈；不包含审核员、
          授权决策、审计证据或 Tracker 内部标识。
        headers:
          Cache-Control:
            description: 本人提交与审核反馈不得由浏览器或中间缓存持久保存。
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../schemas/torrents.yaml#/MyTorrentSubmissionPage"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

