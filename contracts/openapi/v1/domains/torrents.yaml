TorrentCoverPath:
  get:
    operationId: getTorrentCover
    summary: 获取已发布种子的首张公开截图作为封面
    tags: [torrents]
    x-audience: [web]
    x-owner: core-torrents
    x-permission: torrent.read
    x-credential-audience: anonymous
    parameters:
      - $ref: "#/TorrentIDPathParameter"
    responses:
      "200":
        description: >-
          服务端从当前已配置的本地或对象存储读取首张截图，按 PostgreSQL
          中的不可变长度与 SHA-256 证据完整校验后返回。对象键、后端位置、
          版本号和存储凭据不会暴露给浏览器。
        headers:
          Cache-Control:
            description: 短期公共缓存；未来显式封面替换无需沿用旧对象。
            required: true
            schema:
              type: string
          ETag:
            description: 由不可变内容 SHA-256 生成的强校验标签。
            required: true
            schema:
              type: string
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

TorrentScreenshotPath:
  get:
    operationId: getTorrentScreenshot
    summary: 按稳定位置获取已发布种子的公开截图
    tags: [torrents]
    x-audience: [web]
    x-owner: core-torrents
    x-permission: torrent.read
    x-credential-audience: anonymous
    parameters:
      - $ref: "#/TorrentIDPathParameter"
      - name: position
        in: path
        required: true
        description: 上传时确定的不可变截图位置；0 同时是封面。
        schema:
          type: integer
          minimum: 0
          maximum: 5
    responses:
      "200":
        description: >-
          服务端从当前已配置的本地或对象存储读取指定截图，并按 PostgreSQL
          中的不可变长度与 SHA-256 证据完整校验后返回。物理存储信息不暴露给浏览器。
        headers:
          Cache-Control:
            description: 短期公共缓存，并允许后台重新验证。
            required: true
            schema:
              type: string
          ETag:
            description: 由不可变内容 SHA-256 生成的强校验标签。
            required: true
            schema:
              type: string
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

