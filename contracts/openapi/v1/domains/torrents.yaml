TorrentDownloadPath:
  get:
    operationId: downloadTorrent
    summary: 下载绑定本人 Tracker 凭据的已发布种子副本
    tags: [torrents]
    x-audience: [web]
    x-owner: core-torrents
    x-permission: torrent.download
    x-credential-audience: web-session
    parameters:
      - $ref: "#/TorrentIDPathParameter"
    responses:
      "200":
        description: >-
          原始对象已经完整 SHA-256/长度校验；响应只改写 info 字典外的
          announce 字段，且不会在请求 URL 或 JSON 中返回 passkey。
        headers:
          Content-Disposition:
            description: RFC 6266 attachment 文件名。
            required: true
            schema:
              type: string
          Cache-Control:
            description: 凭据化响应必须禁止浏览器与中间缓存保存。
            required: true
            schema:
              type: string
        content:
          application/x-bittorrent:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "402":
        $ref: "../responses.yaml#/ProblemResponse"
      "404":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

