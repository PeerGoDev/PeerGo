MyEconomyPath:
  get:
    operationId: getMyEconomy
    summary: 查看自己的魔力值账本、经验与等级进度
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.read.self
    x-credential-audience: web-session
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
    responses:
      "200":
        description: 仅当前会话成员的整数魔力值账本和精确经验投影。
        content:
          application/json:
            schema:
              $ref: "../schemas/economy.yaml#/EconomyOverview"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

MyMedalsPath:
  get:
    operationId: getMyMedals
    summary: 查看自己的勋章、有效加成和勋章商店
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.medal.read.self
    x-credential-audience: web-session
    responses:
      "200":
        description: 返回当前持有、佩戴顺序、购买状态和封顶后的总加成。
        content:
          application/json:
            schema: { $ref: "../schemas/economy.yaml#/MemberMedalOverview" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyMedalPurchasePath:
  parameters:
    - name: medal_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  post:
    operationId: purchaseMyMedal
    summary: 使用整数魔力值原子购买一枚勋章
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.medal.purchase.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    responses:
      "201":
        description: 扣款、持有记录、库存和购买收据已经在同一事务提交。
        content:
          application/json:
            schema:
              { $ref: "../schemas/economy.yaml#/MemberMedalPurchaseReceipt" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyMedalWearingPath:
  parameters:
    - name: medal_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  put:
    operationId: updateMyMedalWearing
    summary: 佩戴或取下一枚自己的勋章
    tags: [economy]
    x-audience: [member]
    x-owner: core-economy
    x-permission: economy.medal.wear.self
    x-credential-audience: web-session
    parameters:
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../schemas/economy.yaml#/MemberMedalWearingRequest" }
    responses:
      "200":
        description: 佩戴状态与未来奖励权益修订已经提交。
        content:
          application/json:
            schema: { $ref: "../schemas/economy.yaml#/MemberMedalHolding" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyMedalPriorityPath:
