SiteInfoPath:
  get:
    operationId: getSiteInfo
    summary: 获取站点公开信息
    tags: [site]
    x-audience: [web]
    x-owner: core
    x-permission: site.read
    x-credential-audience: anonymous
    responses:
      "200":
        description: 当前站点名称、注册状态和在线人数。
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/SiteInfo"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

StaffSiteDisplaySettingsPath:
  get:
    operationId: getSiteDisplaySettings
    summary: 读取版本化的站点与展示设置
    tags: [site]
    x-audience: [staff]
    x-owner: core-catalog
    x-permission: site.display.manage.read
    x-credential-audience: staff-session
    responses:
      "200":
        description: 当前已经生效的低风险站点与展示设置。
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/SiteDisplaySettings"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"
  put:
    operationId: updateSiteDisplaySettings
    summary: 以乐观并发直接激活低风险站点与展示设置
    tags: [site]
    x-audience: [staff]
    x-owner: core-catalog
    x-permission: site.display.update
    x-credential-audience: staff-session
    parameters:
      - $ref: "../domains/authz.yaml#/StaffCSRFHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/catalog.yaml#/UpdateSiteDisplaySettingsRequest"
    responses:
      "200":
        description: 新版本设置与不可变审计事件已经原子提交并立即生效。
        content:
          application/json:
            schema:
              $ref: "../schemas/catalog.yaml#/SiteDisplaySettings"
      "400":
        $ref: "../responses.yaml#/ProblemResponse"
      "401":
        $ref: "../responses.yaml#/ProblemResponse"
      "403":
        $ref: "../responses.yaml#/ProblemResponse"
      "409":
        $ref: "../responses.yaml#/ProblemResponse"
      "429":
        $ref: "../responses.yaml#/ProblemResponse"
      default:
        $ref: "../responses.yaml#/ProblemResponse"

