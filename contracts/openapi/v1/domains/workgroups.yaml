GroupKindPathParameter:
  name: group_kind
  in: path
  required: true
  schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupKind" }

ApplicationIDPathParameter:
  name: application_id
  in: path
  required: true
  schema: { type: string, format: uuid }

MembershipIDPathParameter:
  name: membership_id
  in: path
  required: true
  schema: { type: string, format: uuid }

TaskIDPathParameter:
  name: task_id
  in: path
  required: true
  schema: { type: string, format: uuid }

AssignmentIDPathParameter:
  name: assignment_id
  in: path
  required: true
  schema: { type: string, format: uuid }

SubmissionIDPathParameter:
  name: submission_id
  in: path
  required: true
  schema: { type: string, format: uuid }

MyWorkgroupsPath:
  get:
    operationId: getMyWorkgroups
    summary: 查看自己的工作组成员资格、申请状态与种审申请条件
    tags: [workgroups]
    x-audience: [web]
    x-owner: core-workgroups
    x-permission: workgroup.read.self
    x-credential-audience: web-session
    responses:
      "200":
        description: 三类固定工作组的当前个人视图。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/MyWorkgroupOverview" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyWorkgroupApplicationsPath:
  post:
    operationId: createMyWorkgroupApplication
    summary: 申请加入允许成员自助申请的工作组
    tags: [workgroups]
    x-audience: [web]
    x-owner: core-workgroups
    x-permission: workgroup.application.create.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../schemas/workgroups.yaml#/CreateWorkgroupApplicationRequest" }
    responses:
      "201":
        description: 申请与当时的准入资格快照已经原子记录。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupApplication" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyWorkgroupContributionCyclesPath:
  get:
    operationId: listMyWorkgroupContributionCycles
    summary: 查看自己的工作组月度贡献历史与证据状态
    tags: [workgroups]
    x-audience: [web]
    x-owner: core-workgroups
    x-permission: workgroup.read.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
    responses:
      "200":
        description: 返回按不可变成员时间线和业务证据重建的月度历史。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupContributionCyclePage" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyWorkgroupTasksPath:
  get:
    operationId: listMyWorkgroupTasks
    summary: 查看发布时分配给自己的工作组任务与活动
    tags: [workgroups]
    x-audience: [web]
    x-owner: core-workgroups
    x-permission: workgroup.read.self
    x-credential-audience: web-session
    parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    responses:
      "200":
        description: 返回冻结成员快照中的本人任务及最新提交状态。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupTaskAssignmentPage" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

MyWorkgroupTaskSubmissionsPath:
  post:
    operationId: submitMyWorkgroupTask
    summary: 提交或在被要求修改后重新提交自己的工作组任务成果
    tags: [workgroups]
    x-audience: [web]
    x-owner: core-workgroups
    x-permission: workgroup.task.submit.self
    x-credential-audience: web-session
    parameters:
      - $ref: "#/AssignmentIDPathParameter"
      - $ref: "../domains/identity.yaml#/WebCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../schemas/workgroups.yaml#/SubmitWorkgroupTaskRequest" }
    responses:
      "201":
        description: 新的不可变成果提交已追加并等待人工验收。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupTaskAssignment" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "404": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

AdminWorkgroupsPath:
  get:
    operationId: getAdminWorkgroups
    summary: 查看工作组定义与待处理数量
    tags: [workgroups]
    x-audience: [staff]
    x-owner: core-workgroups
    x-permission: workgroup.manage.read
    x-credential-audience: staff-session
    responses:
      "200":
        description: 工作组管理概览。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/AdminWorkgroupOverview" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

AdminWorkgroupTasksPath:
  get:
    operationId: listAdminWorkgroupTasks
    summary: 查看指定工作组已经发布的任务与活动
    tags: [workgroups]
    x-audience: [staff]
    x-owner: core-workgroups
    x-permission: workgroup.manage.read
    x-credential-audience: staff-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    responses:
      "200":
        description: 返回发布记录和冻结成员完成汇总。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupTaskPage" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }
  post:
    operationId: publishAdminWorkgroupTask
    summary: 向指定工作组发布任务或活动并冻结当前有效成员名单
    tags: [workgroups]
    x-audience: [staff]
    x-owner: core-workgroups
    x-permission: workgroup.task.publish
    x-credential-audience: staff-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - $ref: "../domains/authz.yaml#/StaffCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../schemas/workgroups.yaml#/PublishWorkgroupTaskRequest" }
    responses:
      "201":
        description: 发布记录与全部成员分配快照已经原子提交。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupTask" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

