AdminWorkgroupContributionPoliciesPath:
  get:
    operationId: listAdminWorkgroupContributionPolicies
    summary: 查询指定工作组的贡献目标时间线
    tags: [workgroups]
    x-audience: [staff]
    x-owner: core-workgroups
    x-permission: workgroup.manage.read
    x-credential-audience: staff-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    responses:
      "200":
        description: 返回当前、已排期和历史不可变贡献目标，不返回管理员身份。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupContributionPolicyPage" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }
  post:
    operationId: issueAdminWorkgroupContributionPolicy
    summary: 签发未来自然月生效的工作组贡献目标
    tags: [workgroups]
    x-audience: [staff]
    x-owner: core-workgroups
    x-permission: workgroup.contribution.policy.issue
    x-credential-audience: staff-session
    parameters:
      - $ref: "#/GroupKindPathParameter"
      - $ref: "../domains/authz.yaml#/StaffCSRFHeader"
      - $ref: "../domains/identity.yaml#/IdempotencyKeyHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../schemas/workgroups.yaml#/IssueWorkgroupContributionPolicyRequest" }
    responses:
      "201":
        description: 新目标已追加到不可变时间线；现有月份和既有贡献证据不会被改写。
        content:
          application/json:
            schema: { $ref: "../schemas/workgroups.yaml#/WorkgroupContributionPolicyRevision" }
      "400": { $ref: "../responses.yaml#/ProblemResponse" }
      "401": { $ref: "../responses.yaml#/ProblemResponse" }
      "403": { $ref: "../responses.yaml#/ProblemResponse" }
      "409": { $ref: "../responses.yaml#/ProblemResponse" }
      default: { $ref: "../responses.yaml#/ProblemResponse" }

