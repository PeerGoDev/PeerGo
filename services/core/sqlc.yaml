version: "2"
sql:
  - engine: postgresql
    schema: ../../db/core/migrations
    queries:
      - internal/modules/catalog/repository_postgres.sql
      - internal/modules/catalog/torrent_bookmark_repository_postgres.sql
    gen:
      go:
        package: catalogdb
        out: internal/generated/catalogdb
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
