name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser:
    name: Source and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache-dependency-path: |
            **/go.sum

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generated, contract, unit and build checks
        run: make check

      - name: Require generated files to be current
        run: git diff --exit-code

      - name: Install Chromium
        run: pnpm --filter @peergo/web exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm test:e2e:web

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  production-images:
    name: Production image builds
    needs: source-and-browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --file deploy/docker/runtime.Dockerfile --tag peergo/runtime:ci .

      - name: Build web image
        run: docker build --file deploy/docker/web.Dockerfile --tag peergo/web:ci .
