# Docker may replace the Core container without restarting this Web container.
# Resolve the service name through Docker's embedded DNS on every short TTL so
# Nginx does not keep proxying to the retired container address after a deploy.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream peergo_core {
    zone peergo_core 64k;
    server core-api:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # PT-depiler's fixed Rousi adapter places the shared personal API key in
    # this legacy route. Keep the sensitive request target out of proxy logs.
    location ~ ^/api/torrent/[1-9][0-9]*/download/[^/]+/?$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://peergo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://peergo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 20m;
    }

    location /rss/ {
        proxy_pass http://peergo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Vite assets are content-addressed. Keep them immutable in browsers and at
    # the edge, and never turn a missing JavaScript module into index.html. A
    # missing hash must not be cached as immutable: the same content hash may
    # legitimately return in a later bounded release window.
    location ^~ /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location = /index.html {
        try_files $uri =503;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
