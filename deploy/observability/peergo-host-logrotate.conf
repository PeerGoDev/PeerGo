# Host-owned logs are outside the PeerGo Compose project, so Docker's
# json-file limits do not protect them.  Keep the legacy 1Panel/OpenResty and
# PtYes logs bounded while allowing the processes to keep their file handles.
#
# The paths are intentionally explicit: this must not rotate arbitrary files
# under /opt or remove application/database data.
/opt/1panel/www/sites/rousi.pro/log/*.log
/opt/1panel/www/sites/rousi.zip/log/*.log
/opt/1panel/www/sites/webp.rousi.pro/log/*.log
/opt/1panel/www/sites/old.rousi.pro/log/*.log
/opt/PtYes/logs/*.log {
    daily
    maxsize 200M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    su root root
}
