root = "../.."
tmp_dir = ".local/air/image-derivative-worker"

[build]
cmd = "go -C ../.. build -o ./.local/air/image-derivative-worker/image-derivative-worker ./services/core/cmd/image-derivative-worker"
entrypoint = ["./.local/air/image-derivative-worker/image-derivative-worker"]
include_ext = ["go"]
include_dir = ["services/core"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
