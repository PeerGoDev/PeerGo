root = "../.."
tmp_dir = ".local/air/contribution-experience-worker"

[build]
cmd = "go -C ../.. build -o ./.local/air/contribution-experience-worker/contribution-experience-worker ./services/core/cmd/contribution-experience-worker"
entrypoint = ["./.local/air/contribution-experience-worker/contribution-experience-worker"]
include_ext = ["go", "sql"]
include_dir = ["services/core", "contracts/go"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
