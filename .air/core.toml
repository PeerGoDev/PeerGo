root = "../.."
tmp_dir = ".local/air/core"

[build]
cmd = "go -C ../.. build -o ./.local/air/core/core-api ./services/core/cmd/api"
entrypoint = ["./.local/air/core/core-api"]
include_ext = ["go"]
include_dir = ["services/core", "contracts/go"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
